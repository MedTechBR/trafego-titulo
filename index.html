/* ---------- ordem das questões ----------
   Dois defeitos corrigidos aqui:
   1) o banco é montado leva a leva e cada leva é temática — na ordem crua havia até
      16 questões seguidas do mesmo tema (342 dos 503 pares adjacentes);
   2) `sort(()=>Math.random()-0.5)` NÃO embaralha de verdade: o comparador é
      inconsistente e o TimSort do V8 deixa o começo do vetor sobrerrepresentado
      (medido: as 50 primeiras posições saíam 47% mais do 1º terço que do último).
      Isso enviesava sobretudo o SORTEIO DO SIMULADO. */

/* Fisher-Yates — permutação uniforme, no lugar */
function embaralha(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* Espalha os temas: a cada passo tira do tema com MAIS questões restantes, evitando
   repetir o tema anterior. Só repete quando é matematicamente inevitável (um tema
   com mais da metade do que sobrou). Dentro do tema, a ordem é aleatória. */
function espalhaTemas(lista){
  const grupos=new Map();
  lista.forEach(q=>{
    const k=q.tema||"_";
    if(!grupos.has(k))grupos.set(k,[]);
    grupos.get(k).push(q);
  });
  grupos.forEach(v=>embaralha(v));
  const out=[]; let anterior=null;
  while(out.length<lista.length){
    /* sorteio PONDERADO pelo que resta de cada tema, proibindo repetir o anterior.
       Pegar sempre o maior (versão determinística) produzia pingue-pongue entre os
       dois temas mais numerosos — só 3 temas distintos nas 20 primeiras. Com o
       sorteio ponderado os temas ficam espalhados E variados, e ainda assim todos
       se esgotam junto no fim. */
    const cand=[]; let peso=0;
    grupos.forEach((v,k)=>{ if(v.length&&k!==anterior){cand.push([k,v.length]);peso+=v.length} });
    let escolhido=null;
    if(cand.length){
      let r=Math.random()*peso;
      for(const [k,n] of cand){ r-=n; if(r<=0){escolhido=k;break} }
      if(escolhido===null)escolhido=cand[cand.length-1][0];
    }else{
      grupos.forEach((v,k)=>{ if(v.length)escolhido=k });   // só sobrou o anterior
    }
    out.push(grupos.get(escolhido).pop());
    anterior=escolhido;
  }
  return out;
}

/* assinatura do filtro: muda o filtro, refaz a ordem */
function assinaturaQ(f,n){return [f.temas.slice().sort().join(","),f.status,f.real?1:0,n].join("|")}

/* o filtro "Só prova real" só aparece se o banco tiver alguma questão de prova real */
const TEM_REAL=BANCO.some(q=>q.fonte);
/* opções do seletor de vários temas (mtfiltro.js), agrupadas pelo eixo do edital */
function opcoesTemas(){
  const n={};BANCO.forEach(q=>n[q.tema]=(n[q.tema]||0)+1);
  return TAXONOMIA.map(t=>({id:t.id,nome:t.nome,grupo:t.eixo,n:n[t.id]||0}));
}

/* ================== QUESTÕES ================== */
const QST={lista:[],idx:0,respondida:false,selecionada:null};
function filtrosQ(){
  const f=ST.pos.fq||{};
  /* temas: lista (vazia = todos). Estado antigo gravava um tema só em "tema". */
  return {temas:MTTemas.lista(f.temas!=null?f.temas:f.tema),status:f.status||"todas",real:TEM_REAL&&!!f.real};
}
function passaFiltroQ(q,f){
    if(f.temas.length&&!f.temas.includes(q.tema))return false;
    if(f.real&&!q.fonte)return false;
    const r=respostaDe(q);
    if(f.status==="nao"&&r)return false;
    if(f.status==="erradas"&&!(r&&r.hist.length&&!r.hist[r.hist.length-1].ok))return false;
    if(f.status==="favoritas"&&!ST.fav[q._ch])return false;
    return true;
}
function aplicaFiltroQ(refazOrdem){
  const f=filtrosQ();
  QST.lista=BANCO.filter(q=>passaFiltroQ(q,f));
  ordenaQuestoes(f,refazOrdem);
}

/* Mantém a MESMA ordem enquanto o filtro não muda (navegar e recarregar não
   reembaralham), mas com os temas espalhados desde a primeira abertura. */
function ordenaQuestoes(f,refazOrdem){
  const ass=assinaturaQ(f,QST.lista.length);
  const salva=ST.pos.ordq;
  if(!refazOrdem&&ST.pos.assq===ass&&Array.isArray(salva)){
    const porCh=new Map(QST.lista.map(q=>[q._ch,q]));
    const ord=[];
    salva.forEach(ch=>{const q=porCh.get(ch);if(q){ord.push(q);porCh.delete(ch)}});
    if(porCh.size)espalhaTemas([...porCh.values()]).forEach(q=>ord.push(q)); // questões novas do banco
    if(ord.length===QST.lista.length){QST.lista=ord;return}
  }
  QST.lista=espalhaTemas(QST.lista);
  ST.pos.assq=ass;
  ST.pos.ordq=QST.lista.map(q=>q._ch);
  ARM.save("tt_pos",ST.pos);
}
function montaQuestoes(){
  const f=filtrosQ();
  const sec=$("#sec-questoes");
  sec.innerHTML=`
  <div class="cartao">
    <div class="linha">
      <span id="fqTema"></span>
      <select id="fqStatus">
        <option value="todas" ${f.status==="todas"?"selected":""}>Todas</option>
        <option value="nao" ${f.status==="nao"?"selected":""}>Não respondidas</option>
        <option value="erradas" ${f.status==="erradas"?"selected":""}>Que errei</option>
        <option value="favoritas" ${f.status==="favoritas"?"selected":""}>Favoritas</option>
      </select>
      ${TEM_REAL?`<label class="linha peq mut" style="gap:5px"><input type="checkbox" id="fqReal" ${f.real?"checked":""}> Só prova real</label>`:""}
      <button class="btn fant" id="fqEmbaralha" title="Reembaralhar (temas espalhados)" aria-label="Reembaralhar as questões"><svg class="ic" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    </div>
  </div>
  <div id="qCorpo"></div>`;
  MTTemas.monta($("#fqTema"),{opcoes:opcoesTemas(),selecionados:f.temas,titulo:"Temas",
    conta:ids=>{const g={...filtrosQ(),temas:ids};return BANCO.reduce((n,q)=>n+(passaFiltroQ(q,g)?1:0),0)},
    aoMudar:ids=>{ST.pos.fq={...filtrosQ(),temas:ids};ST.pos.chq=null;ARM.save("tt_pos",ST.pos);QST.idx=0;montaQuestoes()}});
  $("#fqStatus").onchange=e=>{ST.pos.fq={...filtrosQ(),status:e.target.value};ARM.save("tt_pos",ST.pos);QST.idx=0;montaQuestoes()};
  if(TEM_REAL)$("#fqReal").onchange=e=>{ST.pos.fq={...filtrosQ(),real:e.target.checked};ARM.save("tt_pos",ST.pos);QST.idx=0;montaQuestoes()};
  $("#fqEmbaralha").onclick=()=>{aplicaFiltroQ(true);QST.idx=0;ST.pos.chq=null;ARM.save("tt_pos",ST.pos);desenhaQuestao()};
  aplicaFiltroQ();
  // continuar de onde parei — por CHAVE, nunca por índice
  if(ST.pos.chq){const i=QST.lista.findIndex(q=>q._ch===ST.pos.chq);if(i>=0)QST.idx=i}
  if(QST.idx>=QST.lista.length)QST.idx=0;
  desenhaQuestao();
}

  const box=$("#qCorpo");

  const q=QST.lista[QST.idx];
  QST.respondida=false;QST.selecionada=null;
  ST.pos.chq=q._ch;ARM.save("tt_pos",ST.pos);

  box.innerHTML=`<div class="cartao">
    <div class="q-topo">
      <span class="chip">${esc(TNOME[q.tema]||q.tema)}</span>${q.sub?`<span class="chip">${esc(q.sub)}</span>`:""}${selo}
      <span class="qMeta"><span class="mut peq qNum">${QST.idx+1} de ${QST.lista.length}</span>
      <button id="qFav" type="button" title="${ST.fav[q._ch]?"Tirar dos favoritos":"Favoritar"}" aria-label="Favoritar questão" aria-pressed="${!!ST.fav[q._ch]}" style="color:${ST.fav[q._ch]?"var(--warn)":"var(--mut)"}">
        <svg class="ic" viewBox="0 0 24 24" ${ST.fav[q._ch]?'fill="currentColor"':""}><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg></button></span>
    </div>
    <div class="q-enun">${esc(q.q)}</div>
    <div id="qAlts">${q.alts.map((a,i)=>`
      <button type="button" class="alt ${riscos.includes(i)?"riscada":""}" data-i="${i}" aria-keyshortcuts="${LETRAS[i]}">
        <span class="letra">${LETRAS[i]}</span><span class="txt">${esc(a)}</span>
        <span class="risco" title="Riscar alternativa"><svg viewBox="0 0 24 24" class="ic"><path d="M4 12h16M9 5l6 14"/></svg></span>
      </button>`).join("")}</div>
    <div class="navq">
      <button class="btn fant ant" id="qAnt" type="button" title="Anterior (seta para a esquerda)" aria-label="Anterior" aria-keyshortcuts="ArrowLeft">${ICO_VOLTA}<span class="soAmplo">Anterior</span></button>
      <button class="btn" id="qResp" type="button" disabled title="Responder (Enter)" aria-keyshortcuts="Enter">Responder</button>
      <button class="btn fant" id="qProx" type="button" style="margin-left:auto" title="Próxima (seta para a direita)" aria-keyshortcuts="ArrowRight">Próxima${ICO_SEGUE}</button>
    </div>
    <div id="qFeed"></div>
  </div>`;
  $("#qFav").onclick=()=>{if(ST.fav[q._ch])delete ST.fav[q._ch];else ST.fav[q._ch]=1;ARM.save("tt_fav",ST.fav);desenhaQuestao()};
  $("#qAnt").onclick=()=>{if(QST.idx>0){QST.idx--;desenhaQuestao();entraQuestao(true)}};
  $("#qProx").onclick=()=>{if(QST.idx<QST.lista.length-1){QST.idx++;desenhaQuestao();entraQuestao(false)}};
  $("#qResp").onclick=()=>respondeQuestao(q);
  box.querySelectorAll(".alt").forEach(el=>ligaAlternativa(el,q));
}
function ligaAlternativa(el,q){
  const i=+el.dataset.i;
  el.querySelector(".risco").onclick=e=>{e.stopPropagation();toggleRisco(q,i)};
  // arrastar para o lado risca (toque e mouse); clique seleciona
  let x0=null,y0=null,arrastou=false;
  el.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY;arrastou=false});
  el.addEventListener("pointermove",e=>{
    if(x0===null||QST.respondida)return;
    if(Math.abs(e.clientX-x0)>56&&Math.abs(e.clientY-y0)<28&&!arrastou){arrastou=true;toggleRisco(q,i)}
  });
  el.addEventListener("pointerup",()=>{setTimeout(()=>{x0=null},0)});
  el.addEventListener("click",()=>{
    if(arrastou||QST.respondida)return;
    if((ST.riscos[q._ch]||[]).includes(i))return;
    QST.selecionada=i;
    document.querySelectorAll("#qAlts .alt").forEach(a=>a.classList.toggle("sel",+a.dataset.i===i));
    $("#qResp").disabled=false;
  });
}
function toggleRisco(q,i){
  const r=ST.riscos[q._ch]||(ST.riscos[q._ch]=[]);
  const p=r.indexOf(i);
  if(p>=0)r.splice(p,1);else{r.push(i);if(QST.selecionada===i){QST.selecionada=null;$("#qResp").disabled=true}}
  if(!r.length)delete ST.riscos[q._ch];
  ARM.save("tt_riscos",ST.riscos);
  const el=document.querySelector(`#qAlts .alt[data-i="${i}"]`);
  if(el){el.classList.toggle("riscada",p<0);el.classList.remove("sel")}
}
function respondeQuestao(q){
  if(QST.selecionada===null||QST.respondida)return;
  QST.respondida=true;
  const ok=QST.selecionada===q.gab;
  registraResposta(q,QST.selecionada,ok,"estudo");
  document.querySelectorAll("#qAlts .alt").forEach(el=>{
    const i=+el.dataset.i;
    if(i===q.gab)el.classList.add("certa");
    else if(i===QST.selecionada)el.classList.add("errada");
  });
  $("#qResp").disabled=true;
  $("#qFeed").innerHTML=`<div class="coment">
    <b class="${ok?"verde":"vermelho"}">${ok?"Acertou.":"Errou. Gabarito: "+LETRAS[q.gab]+"."}</b>
    <div style="margin-top:6px">${esc(q.coment)}</div>
    ${q.porAlt?`<div class="porq">${q.porAlt.map((p,i)=>`<div><b>${LETRAS[i]})</b> ${esc(p)}</div>`).join("")}</div>`:""}
    ${q.base?`<div class="base"><b>Base:</b> ${esc(q.base)}</div>`:""}
    ${ok?"":`<div style="margin-top:10px"><button class="btn fant" id="qLog">Anotar no log de erros</button></div>`}
  </div>`;
  const bl=$("#qLog");
  if(bl)bl.onclick=()=>{
    ST.erros.unshift({id:novoIdLinha(),d:dataISO(),tema:q.tema,ref:q._ch,oque:(q.sub||q.tema)+": "+q.q.slice(0,80)+"…",porque:"",licao:""});
    ARM.save("tt_erros",ST.erros);
    UI.banner("ok","Anotado no log de erros. Complete o motivo e a lição na aba Erros.");
    bl.disabled=true;bl.innerHTML=ICO_CHECK+"Anotado";
  };
  vivoResposta(ok);
}

function desenhaSimAtivo(){
  const s=ST.simativo, sec=$("#sec-simulado");
  const qs=s.qs.map(ch=>QIDX.get(ch)).filter(Boolean);
  if(!qs.length){ST.simativo=null;ARM.save("tt_simativo",null);montaSimulado();return}
  if(s.pos>=qs.length)s.pos=0;
  const q=qs[s.pos];
  sec.innerHTML=`
  <div class="cartao">
    <div class="linha" style="justify-content:space-between">

  });
  $("#simAnt").onclick=()=>{if(s.pos>0){s.pos--;ARM.save("tt_simativo",s);desenhaSimAtivo();entraSim(true)}};

    const faltam=qs.length-Object.keys(s.resp).length;

    finalizaSim(qs);
  };
  clearInterval(cronSimId);
  const tick=()=>{
    const rest=s.ini+s.min*60000-Date.now();
    if(rest<=0){clearInterval(cronSimId);UI.banner("info","Tempo esgotado. O simulado foi entregue.");finalizaSim(qs);return}
    const mm=Math.floor(rest/60000),ss=Math.floor(rest%60000/1000);

  };

function finalizaSim(qs){
  clearInterval(cronSimId);
  const s=ST.simativo;if(!s)return;
  const detalhes=qs.map(q=>{const alt=s.resp[q._ch];const ok=alt===q.gab;
    if(alt!=null)registraResposta(q,alt,ok,"sim");
    return {ch:q._ch,alt:alt==null?null:alt,ok:alt==null?false:ok}});
  const acertos=detalhes.filter(d=>d.ok).length;
  const nota=acertos/detalhes.length*100;
  ST.sim.push({id:Date.now().toString(36),quando:dataISO(),nota,acertos,detalhes});
  ARM.save("tt_sim",ST.sim);
  ST.simativo=null;ARM.save("tt_simativo",null);
  ARM.snapshot("fim-de-simulado");
  desenhaRevisao(ST.sim.length-1,0,true);
}

const PRT={id:null,mostrou:false};
function notaCaso(c,marcados){
  const tot=c.espelho.reduce((a,p)=>a+p.peso,0);
  if(!tot)return 0;
  const got=c.espelho.reduce((a,p,i)=>a+(marcados.includes(i)?p.peso:0),0);
  return Math.round(got/tot*100)/10;   // escala 0–10, uma casa
}

/* ================== PAINEL ================== */
function incidencia(){
  const reais=BANCO.filter(q=>q.fonte);
  if(reais.length<10)return {uniforme:true,map:Object.fromEntries(TAXONOMIA.map(t=>[t.id,1/TAXONOMIA.length]))};
  const m={};TAXONOMIA.forEach(t=>m[t.id]=reais.filter(q=>q.tema===t.id).length/reais.length);
  return {uniforme:false,map:m};
}
function statsTema(){
  const por={};
  for(const [ch,r] of Object.entries(ST.resp)){
    const q=QIDX.get(ch);if(!q)continue;          // chave órfã: ignora (falha segura)
    (por[q.tema]=por[q.tema]||[]).push(...r.hist);
  }
  return por;
}
function revisaoTemas(){
  const por=statsTema();
  return TAXONOMIA.map(t=>{
    const hs=(por[t.id]||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
    if(!hs.length)return {t,nunca:true};
    const ult=hs[hs.length-1].d,u20=hs.slice(-20);
    const acc=u20.filter(h=>h.ok).length/u20.length;
    const iv=Math.max(1,Math.min(15,Math.round(1+14*acc*acc)));
    const due=addDiasISO(ult,iv);
    return {t,ult,acc,iv,due,atrasado:due<dataISO()};
  });
}
function ofensiva(){
  let d=new Date(),n=0;
  if(!ST.atividade[dataISO(d)])d.setDate(d.getDate()-1);
  while(ST.atividade[dataISO(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}

 {id:"assoc",rot:"Associação a sociedade médica da área",op:[["0","Não",0],["s","Sim",10]]}
];
const CURRIC_MAX=CURRIC.reduce((a,c)=>a+Math.max(...c.op.map(o=>o[2])),0);
function pontosCurriculo(){
  const c=ST.cfg.curric||{};
  return CURRIC.reduce((a,g)=>{const v=c[g.id],o=g.op.find(x=>x[0]===v);return a+(o?o[2]:0)},0);
}
function notaSimulada(){
  // teórica: acerto nos simulados recentes (ou geral, se não houver simulado)
  const sims=ST.sim.slice(-3);
  let teor=null;
  if(sims.length)teor=sims.reduce((a,s)=>a+s.nota,0)/sims.length/10;
  else{const h=Object.values(ST.resp).flatMap(r=>r.hist);if(h.length>=10)teor=h.filter(x=>x.ok).length/h.length*10}
  // teórico-prática: média dos casos corrigidos
  const cs=Object.values(ST.treino).filter(t=>t.d&&t.nota!==undefined);
  const prat=cs.length?cs.reduce((a,t)=>a+t.nota,0)/cs.length:null;
  // currículo: pontos convertidos para 0–10 (a régua oficial da banca não é publicada;
  // aqui é proporção sobre o teto do Anexo I — serve para comparar cenários, não é a nota real)
  const cur=CURRIC_MAX?Math.min(10,pontosCurriculo()/CURRIC_MAX*10):0;
  const fim=(teor===null||prat===null)?null:(teor*0.6+prat*0.3+cur*0.1);
  return {teor,prat,cur,fim,pontos:pontosCurriculo()};
}
/* ================== CARTÕES (SM-2 simplificado) ================== */
function sm2(st,nota){
  if(nota<3){st.reps=0;st.iv=1}
  else{st.reps=(st.reps||0)+1;st.iv=st.reps===1?1:st.reps===2?6:Math.round((st.iv||1)*(st.ef||2.5))}
  st.ef=Math.max(1.3,(st.ef||2.5)+(0.1-(5-nota)*(0.08+(5-nota)*0.02)));
  st.due=addDiasISO(dataISO(),st.iv);
  st.ts=Date.now();
  return st;
}

  const sec=$("#sec-plano");
  const hj=dataISO();
  const plano=ST.plano.slice().sort((a,b)=>a.d<b.d?-1:1);
  sec.innerHTML=`<div class="cartao">
    <div class="linha" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">Cronograma vivo</h2>
      <div class="linha">
        <button class="btn fant" id="plGera" type="button">Gerar rascunho até a prova</button>
        <button class="btn" id="plAdd" type="button">Adicionar dia</button>
      </div>
    </div>
    ${plano.length?`<div class="rolagem"><table>
      <tr><th style="width:110px">Data</th><th>Tema</th><th style="width:60px">Feito</th><th style="width:90px"></th><th></th></tr>
      ${plano.map(p=>{const i=ST.plano.indexOf(p);
        const cls=p.feito?"verde":(p.d<hj?"vermelho":(p.d===hj?"ambar":""));
        return `<tr>
        <td class="${cls}">${p.d===hj?"<b>hoje</b> ":""}${esc(p.d)}</td>
        <td><select data-i="${i}" data-c="tema" aria-label="Tema do dia">${TAXONOMIA.map(t=>`<option value="${t.id}" ${p.tema===t.id?"selected":""}>${esc(t.nome)}</option>`).join("")}</select></td>
        <td><input type="checkbox" data-i="${i}" data-c="feito" ${p.feito?"checked":""} aria-label="Dia feito"></td>
        <td><button class="btn fant peq" type="button" data-vai="${p.tema}">Questões</button></td>
        <td><button type="button" data-del="${i}" class="btIco perigo" title="Excluir dia" aria-label="Excluir dia">${ICO_LIXO}</button></td></tr>`}).join("")}
    </table></div>`:`<div class="vazio"><p>Sem plano ainda. ${ST.meta.dataProva?"Gere um rascunho com um tema por dia até a prova, ou adicione dias à mão.":"Defina a data da prova no Painel para gerar o rascunho, ou adicione dias à mão."}</p>${ST.meta.dataProva?"":`<button class="btn fant" type="button" id="plPainel">Definir a data no Painel</button>`}</div>`}
  </div>`;
  const pp=$("#plPainel");if(pp)pp.onclick=()=>{irAba("painel");setTimeout(()=>{const d=$("#metaData");if(d){d.scrollIntoView({block:"center"});d.focus()}},60)};
  $("#plAdd").onclick=()=>{ST.plano.push({id:novoIdLinha(),d:hj,tema:TAXONOMIA[0].id,feito:false});ARM.save("tt_plano",ST.plano);montaPlano()};
  $("#plGera").onclick=()=>{
    if(!ST.meta.dataProva){UI.banner("info","Defina a data da prova no Painel primeiro.");return}
    if(ST.plano.length&&!confirm("Substituir o plano atual pelo rascunho gerado? (dias já feitos são preservados)"))return;
    const inc=incidencia(),por=statsTema();
    const ordem=TAXONOMIA.map(t=>{const acc=taxaAcerto(por[t.id]||[]);
      return {id:t.id,pri:(inc.map[t.id]||0)*(acc===null?0.7:1-acc)}}).sort((a,b)=>b.pri-a.pri).map(x=>x.id);
    const feitos=Object.fromEntries(ST.plano.filter(p=>p.feito).map(p=>[p.d+"|"+p.tema,true]));
    const novo=[];let d=hj,i=0;
    while(d<ST.meta.dataProva){novo.push({id:novoIdLinha(),d,tema:ordem[i%ordem.length],feito:!!feitos[d+"|"+ordem[i%ordem.length]]});d=addDiasISO(d,1);i++}
    ST.plano=novo;ARM.save("tt_plano",ST.plano);montaPlano();
    UI.banner("ok",`Rascunho gerado: ${novo.length} ${novo.length===1?"dia":"dias"} até a prova.`);
  };
  sec.querySelectorAll("select[data-c],input[data-c]").forEach(el=>{
    el.onchange=()=>{const p=ST.plano[+el.dataset.i];
      if(el.dataset.c==="feito")p.feito=el.checked;else p[el.dataset.c]=el.value;
      ARM.save("tt_plano",ST.plano);montaPlano()};
  });
  sec.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ST.plano.splice(+b.dataset.del,1);ARM.save("tt_plano",ST.plano);montaPlano()});
  sec.querySelectorAll("[data-vai]").forEach(b=>b.onclick=()=>{
    ST.pos.fq={temas:[b.dataset.vai],status:"todas",real:false};ST.pos.chq=null;ARM.save("tt_pos",ST.pos);irAba("questoes")});
}

/* ================== camada viva (23/09/2026, tt-v15) ==================
   Só apresentação: entrada escalonada, contadores, barras e anel que se preenchem, questão que
   desliza na direção da navegação, sequência de acertos, confete ao bater a meta do dia e o herói
   do Painel. Lê o estado (ST) e nunca grava nada por conta própria. */
let COMBO=0;
const reduzMov=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function vivo(sec){
  if(!sec||document.body.classList.contains("lendo"))return;
  sec.classList.remove("anima");void sec.offsetWidth;sec.classList.add("anima");
  [...sec.children].forEach((c,k)=>c.style.setProperty("--i",Math.min(k,12)));
  const reduz=reduzMov();
  /* números dos indicadores sobem de 0 até o valor (só inteiros: "123", "56%", "3 d") */
  sec.querySelectorAll(".mini .gd,[data-conta]").forEach(el=>{
    if(el.children.length)return;
    const m=/^(\d+)(%| d)?$/.exec(el.textContent.trim());if(!m)return;
    const fim=+m[1],suf=m[2]||"";
    if(reduz||!fim)return;
    const t0=performance.now(),d=900;let feito=false;
    const passo=t=>{if(feito)return;const p=Math.max(0,Math.min(1,(t-t0)/d)),e=1-Math.pow(1-p,3);el.textContent=Math.round(fim*e)+suf;if(p<1)requestAnimationFrame(passo);else feito=true};
    el.textContent="0"+suf;requestAnimationFrame(passo);
    /* aba em segundo plano congela o requestAnimationFrame: o valor final chega de qualquer jeito */
    setTimeout(()=>{feito=true;el.textContent=fim+suf},d+150);
  });
  if(reduz)return;
  /* barras e anel: nascem vazios e se preenchem */
  const barras=[...sec.querySelectorAll(".barra i")].map(el=>{const w=el.style.width;el.style.transition="none";el.style.width="0";return [el,w]});
  const aneis=[...sec.querySelectorAll("[data-off]")];
  aneis.forEach(el=>{el.style.transition="none";el.style.strokeDashoffset=el.getAttribute("stroke-dasharray")});
  void sec.offsetWidth;
  setTimeout(()=>{
    barras.forEach(([el,w])=>{el.style.transition="";el.style.width=w});
    aneis.forEach(el=>{el.style.transition="";el.style.strokeDashoffset=el.dataset.off});
  },40);
}

function entra(el,volta){
  if(!el)return;
  el.classList.remove("entra","volta");void el.offsetWidth;el.classList.add("entra");if(volta)el.classList.add("volta");
}

const entraSim=volta=>entra($("#sec-simulado>.cartao:last-child"),volta);

/* meta do dia derivada da meta que ele já definiu no Painel (data da prova + alvo de questões):
   o que falta do alvo, contando só o que foi respondido ATÉ ONTEM, dividido pelos dias até a prova.
   Estável durante o dia. Sem data ou sem alvo: não há meta e não há confete. */
function metaDia(){
  const m=ST.meta||{};if(!m.dataProva||!m.alvo)return null;
  const dias=Math.round((new Date(m.dataProva+"T12:00:00")-new Date(dataISO()+"T12:00:00"))/86400000);
  if(dias<=0)return null;
  const hj=dataISO();let total=0,hoje=0;
  Object.values(ST.resp).forEach(r=>r.hist.forEach(h=>{total++;if(h.d===hj)hoje++}));
  const meta=Math.ceil(Math.max(0,m.alvo-(total-hoje))/dias);
  return meta>0?{meta,hoje}:null;
}
const ICO_RAIO='<svg class="ic" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
function vivoResposta(ok){
  COMBO=ok?COMBO+1:0;
  const t=$("#sec-questoes .q-topo"),v=$("#sec-questoes .qCombo");if(v)v.remove();
  if(t&&COMBO>=2){const c=document.createElement("span");c.className="qCombo";c.innerHTML=`${ICO_RAIO}${COMBO} seguidas`;t.insertBefore(c,t.querySelector(".qMeta"))}
  const md=metaDia();
  if(md&&md.hoje===md.meta){confete();UI.banner("ok",`Meta do dia batida: ${md.meta} questões.`)}
}
/* confete leve em canvas, nas cores das placas: 1,6 s e some sozinho; nada com movimento reduzido */
function confete(){
  if(reduzMov())return;
  const cv=document.createElement("canvas");cv.className="confete";document.body.appendChild(cv);
  const dpr=devicePixelRatio||1,W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr,x=cv.getContext("2d");
  const cores=["#E29215","#E8691C","#C0261F","#1D5FA6","#12704A","#8A5431","#2F3540"];
  const ps=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*26*dpr,vy:(-Math.random()*22-6)*dpr,
    s:(6+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cores[Math.random()*cores.length|0],f:Math.random()<.5}));
  const t0=performance.now();
  const q=t=>{const el=t-t0;x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.9*dpr;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-el/1600);x.fillStyle=p.c;
      if(p.f)x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else{x.beginPath();x.moveTo(0,-p.s/2);x.lineTo(p.s/2,0);x.lineTo(0,p.s/2);x.lineTo(-p.s/2,0);x.closePath();x.fill()}x.restore()});
    if(el<1600)requestAnimationFrame(q);else cv.remove()};
  requestAnimationFrame(q);
}

/* herói do Painel: só números que o app já calcula (respostas, questões vistas, acerto, meta) */
const ICO_ADV='<svg class="ic" viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/><path d="M12 8v4.5M12 15.8h.01"/></svg>';
function heroiPainel(totalResp,unicas,accG){
  const d=ST.meta&&ST.meta.dataProva;
  const dias=d?Math.round((new Date(d+"T12:00:00")-new Date(dataISO()+"T12:00:00"))/86400000):null;
  const selo=dias===null?"Painel de estudo":dias>1?`faltam ${dias} dias para a prova`:dias===1?"a prova é amanhã":dias===0?"a prova é hoje":"prova realizada";
  const md=metaDia();
  const pct=accG===null?null:Math.round(accG*100);
  const R=54,C=+(2*Math.PI*R).toFixed(2);
  const fr=md?Math.min(1,md.hoje/md.meta):pct===null?0:pct/100;
  const off=+(C*(1-fr)).toFixed(2);
  const anel=md
    ?{rot:`Meta de hoje: ${md.hoje} de ${md.meta} questões`,val:`<b><span data-conta>${md.hoje}</span></b><span>de ${md.meta} hoje</span>`,corte:false,cheio:md.hoje>=md.meta}
    :{rot:`Acerto geral: ${pct===null?"sem respostas ainda":pct+"%"}; marca no corte de 60%`,val:pct===null?`<b class="vazio">sem dados</b><span>acerto geral</span>`:`<b><span data-conta>${pct}</span>%</b><span>acerto geral</span>`,corte:true};
  return `<div class="vHero">
    <span class="losango l1" aria-hidden="true"></span><span class="losango l2" aria-hidden="true"></span>
    <div class="txt">
      <small>${ICO_ADV}${esc(selo)}</small>
      <h2><span data-conta>${unicas}</span> de ${BANCO.length} questões já vistas</h2>
      <p>${totalResp} respostas no total${pct===null?"":`, ${pct}% de acerto`}. Corte da teórica: 6,0.${md?(md.hoje>=md.meta?" Meta de hoje cumprida.":` Faltam ${md.meta-md.hoje} para a meta de hoje.`):""}</p>
      <div class="acoesH">
        <button class="btn" type="button" data-vh="questoes">Continuar questões</button>
        <button class="btn fant" type="button" data-vh="simulado">Simulado</button>
      </div>
    </div>
    <div class="vAnel${anel.cheio?" cheio":""}" role="img" aria-label="${anel.rot}">
      <svg viewBox="0 0 132 132" width="132" height="132" aria-hidden="true">
        <circle class="trilho" cx="66" cy="66" r="${R}"/>
        <circle class="arco" cx="66" cy="66" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${off}" data-off="${off}"/>
        ${anel.corte?`<line class="corte" x1="106" y1="66" x2="126" y2="66" transform="rotate(216 66 66)"/>`:""}
      </svg>
      <div class="val">${anel.val}</div>
    </div>
  </div>`;
}

   (a questão inteira tem de caber na tela); na leitura aberta e no simulado em curso também some. */
function infoAba(id){
  const n=(v,um,varios)=>`${v} ${v===1?um:varios}`;
  if(id==="simulado"){const k=ST.sim.length;
    return k?`${n(k,"simulado feito","simulados feitos")}, o último com ${Math.round(ST.sim[k-1].nota)}% de acerto`:"50 questões com cronômetro, como na prova"}
  if(id==="pratica")return `${PRATICA.filter(c=>ST.treino[c.id]).length} de ${PRATICA.length} casos feitos`;
  if(id==="leitura")return `${Object.keys(ST.lidas).length} de ${LEITURAS.filter(i=>i.f).length} lidas`;
  if(id==="painel")return "Desempenho, meta do dia e nota projetada";
  if(id==="cartoes")return `${cartoesDeHoje().length} para hoje, de ${FLASH.length} cartões`;
  if(id==="erros")return ST.erros.length?n(ST.erros.length,"anotação","anotações"):"Nenhuma anotação ainda";
  if(id==="plano"){const k=ST.plano.length;return k?`${ST.plano.filter(p=>p.feito).length} de ${k} dias feitos`:"Um tema por dia até a prova"}
  if(id==="ajustes")return `Versão ${V}, ${BANCO.length} questões`;
  return "";
}

/* ---------- atalhos de teclado (computador) ----------
   Questões: A a E (ou 1 a 5) escolhe, Enter responde e depois avança, setas navegam.
   Simulado: A a E marca e avança, setas navegam; na revisão, setas. Cartões: espaço mostra a resposta,
   1 a 4 avaliam. Leitura: "/" vai para a busca, Esc fecha a leitura aberta. Nada dispara com o foco num campo. */
function atalhos(e){
  if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey)return;
  const alvo=e.target||document.body,tag=alvo.tagName||"";
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)||alvo.isContentEditable)return;
  if(!$("#maisFolha").hidden)return;
  const k=e.key,K=k.length===1?k.toUpperCase():k;
  const livre=alvo===document.body||alvo===document.documentElement;
  const visivel=b=>b&&!b.disabled&&!b.hidden&&b.offsetParent!==null;
  const clica=sel=>{const b=$(sel);if(visivel(b)){b.click();return true}return false};
  const letra="ABCDE".includes(K)?"ABCDE".indexOf(K):"12345".includes(K)?"12345".indexOf(K):-1;
  const feito=()=>e.preventDefault();
  if(abaAtual==="questoes"&&$("#qAlts")){
    if(letra>=0){if(!QST.respondida&&clica(`#qAlts .alt[data-i="${letra}"]`))feito();return}
    if(k==="Enter"&&(livre||alvo.closest("#qAlts")||alvo.id==="qResp")){if(QST.respondida?clica("#qProx"):clica("#qResp"))feito();return}
    if(k==="ArrowRight"){if(clica("#qProx"))feito();return}
    if(k==="ArrowLeft"){if(clica("#qAnt"))feito();return}
    return;
  }
  if(abaAtual==="simulado"){
    if($("#simAlts")){
      if(letra>=0){if(clica(`#simAlts .alt[data-i="${letra}"]`))feito();return}
      if(k==="ArrowRight"){if(clica("#simProx"))feito();return}
      if(k==="ArrowLeft"){if(clica("#simAnt"))feito();return}
    }else if($("#revVoltar")){
      if(k==="ArrowRight"){if(clica("#revProx"))feito();return}
      if(k==="ArrowLeft"){if(clica("#revAnt"))feito();return}
    }
    return;
  }
  if(abaAtual==="cartoes"){
    if((k===" "||k==="Enter")&&livre){if(clica("#fcMostra"))feito();return}
    if("1234".includes(k)&&k.length===1){const b=$("#fcNotas")&&!$("#fcNotas").hidden&&$("#fcNotas").querySelectorAll("button")[+k-1];if(b){b.click();feito()}return}
    return;
  }
  if(abaAtual==="leitura"){
    if(k==="/"&&!LEI.aberta){const b=$("#leiBusca");if(b){b.focus();b.select();feito()}return}
    if(k==="Escape"&&LEI.aberta){if(clica("#leiVolta"))feito();return}
  }
}
addEventListener("keydown",atalhos);

function escuroAgora(){
  const t=document.documentElement.dataset.tema;

  return matchMedia("(prefers-color-scheme: dark)").matches;

  };
}

/* ---------- contagem regressiva para a prova ---------- */
function pintaContagem(){
  const el=$("#contagem"); if(!el)return;
  const d=ST.meta&&ST.meta.dataProva;
  if(!d){el.hidden=true;return}
  const dias=Math.ceil((new Date(d+"T12:00:00")-new Date())/86400000);
  el.hidden=false;
  if(dias>1) el.innerHTML=`faltam <b>${dias}</b> dias`;
  else if(dias===1) el.innerHTML="<b>amanhã</b>";
  else if(dias===0) el.innerHTML="<b>é hoje</b>";
  else el.innerHTML="prova realizada";
}

/* ---------- boot ---------- */
(async function boot(){
  await ARM.boot();
  carregaEstado();
  montaAbas();
  medeCabecalho();
  $("#subTopo").textContent=`${BANCO.length} questões e ${PRATICA.length} casos`;
  iniciaTema();
  pintaContagem();
  if(ARM.persistOK===false)console.warn("storage.persist() negado — comum no iOS; espelho IDB ativo.");
  if(ST.simativo&&!ST.simativo.fim)UI.banner("info","Há um simulado em andamento. Retome na aba Simulado.");
  /* deep link vindo das leituras: ?area=<tema> abre Questões já filtrado */
  try{
    const area=new URLSearchParams(location.search).get("area");
    if(area&&TAXONOMIA.some(t=>t.id===area)){
      ST.pos.fq={temas:[area],status:"todas",real:false};ST.pos.chq=null;
      ARM.save("tt_pos",ST.pos);
      history.replaceState(null,"",location.pathname+"#questoes");
    }
  }catch(e){}
  const h=location.hash.slice(1);
  irAba(ABAS.some(a=>a[0]===h)?h:(ST.pos.aba&&ABAS.some(a=>a[0]===ST.pos.aba)?ST.pos.aba:"questoes"),false);
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
  ARM.snapshot("boot");
  window.__ttPronto=true;window.dispatchEvent(new Event("tt-pronto"));
})();

window.__tt={get ST(){return ST},ARM,chaveQ,chaveTxt,QIDX,irAba,registraResposta,V,escuroAgora,pintaContagem,embaralha,espalhaTemas,get QST(){return QST}};
