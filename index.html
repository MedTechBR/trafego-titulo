<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14171D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F14" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;450;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>TráfegoTítulo</title>
<script>try{var _t=localStorage.getItem("tt_tema");if(_t)document.documentElement.dataset.tema=_t}catch(e){}</script>
<style>
/* ===== TráfegoTítulo — identidade "Asfalto & Sinalização" =====
   Ink = asfalto. Âmbar = placa de advertência. Verde = rodovia. Vermelho = parada.
   As cores semânticas SÃO as cores da sinalização viária — nada é decorativo. */
:root{
  color-scheme:light;
  --bg:#F5F1E8; --pan:#FFFFFF; --pan2:#EFEADE; --pan3:#FAF7F0;
  --line:#E1DACA; --line2:#EDE7D9;
  --ink:#181B21; --ink2:#3A414B; --mut:#6E6759;
  --brand:#E29215; --brand2:#C77A0B; --brandInk:#8A5108; --brandBg:#FDF3E1; --brandLine:#F0D6A2;
  --ok:#1B7A45; --okBg:#E9F5ED; --okLine:#A6D8BA;
  --err:#C0261F; --errBg:#FBEDEB; --errLine:#E9B0AB;
  --warn:#A9600A; --warnBg:#FBF1DF;
  --onBrand:#20170A;
  --sh:0 1px 2px rgba(24,27,33,.05),0 6px 16px -10px rgba(24,27,33,.18);
  --sh2:0 2px 6px rgba(24,27,33,.08),0 18px 36px -16px rgba(24,27,33,.28);
  --r:12px; --r2:9px; --r3:7px;
  --fD:Archivo,"Archivo",-apple-system,"Segoe UI",Roboto,sans-serif;
  --fB:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  --t:160ms cubic-bezier(.32,.72,.35,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema=claro]){
    color-scheme:dark;
    --bg:#101318; --pan:#171B22; --pan2:#1F242D; --pan3:#141821;
    --line:#2D343F; --line2:#232932;
    --ink:#ECE8E0; --ink2:#C5CAD3; --mut:#929AA6;
    --brand:#F2A93B; --brand2:#FFC168; --brandInk:#F2A93B; --brandBg:#2A2115; --brandLine:#4A3A1E;
    --ok:#4FCB85; --okBg:#13261C; --okLine:#2D5C42;
    --err:#F0736A; --errBg:#2A1716; --errLine:#5E312D;
    --warn:#E8A33D; --warnBg:#2A2115;
    --onBrand:#1A1206;
    --sh:0 1px 2px rgba(0,0,0,.45),0 8px 20px -12px rgba(0,0,0,.8);
    --sh2:0 2px 8px rgba(0,0,0,.5),0 22px 40px -18px rgba(0,0,0,.9);
  }
}
:root[data-tema=escuro]{
  color-scheme:dark;
  --bg:#101318; --pan:#171B22; --pan2:#1F242D; --pan3:#141821;
  --line:#2D343F; --line2:#232932;
  --ink:#ECE8E0; --ink2:#C5CAD3; --mut:#929AA6;
  --brand:#F2A93B; --brand2:#FFC168; --brandInk:#F2A93B; --brandBg:#2A2115; --brandLine:#4A3A1E;
  --ok:#4FCB85; --okBg:#13261C; --okLine:#2D5C42;
  --err:#F0736A; --errBg:#2A1716; --errLine:#5E312D;
  --warn:#E8A33D; --warnBg:#2A2115;
  --onBrand:#1A1206;
  --sh:0 1px 2px rgba(0,0,0,.45),0 8px 20px -12px rgba(0,0,0,.8);
  --sh2:0 2px 8px rgba(0,0,0,.5),0 22px 40px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--fB);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
h1,h2,h3,.gd,.num{font-family:var(--fD);letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-size:16px;font-family:inherit;background:var(--pan);color:var(--ink);border:1px solid var(--line);border-radius:var(--r3);padding:11px 12px;min-height:44px;transition:border-color var(--t),box-shadow var(--t)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.alt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandBg)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--brand)}
a{color:var(--brandInk);text-underline-offset:2px}
svg.ic{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--brand);color:var(--onBrand)}

/* ---------- faixas de aviso ---------- */
#faixas{position:sticky;top:0;z-index:60}
.faixa{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;font-size:13.5px;font-weight:500;border-bottom:1px solid var(--line)}
.faixa.ok{background:var(--okBg);color:var(--ok);border-bottom-color:var(--okLine)}
.faixa.erro{background:var(--errBg);color:var(--err);border-bottom-color:var(--errLine)}
.faixa.info{background:var(--brandBg);color:var(--brandInk);border-bottom-color:var(--brandLine)}
.faixa button{margin-left:auto;color:inherit;opacity:.65;font-size:16px;padding:0 4px}
.faixa button:hover{opacity:1}

/* ---------- cabeçalho asfalto ---------- */
header{position:sticky;top:0;z-index:50;background:#14171D;color:#EFEBE3;box-shadow:0 1px 0 rgba(0,0,0,.25),0 6px 20px -14px rgba(0,0,0,.9)}
:root[data-tema=escuro] header{background:#0C0F14}
.topo{display:flex;align-items:center;gap:11px;padding:11px 16px 9px;max-width:1000px;margin:0 auto}
.marca{width:29px;height:29px;border-radius:8px;background:var(--brand);color:#20170A;display:grid;place-items:center;flex:none}
.marca svg{width:19px;height:19px;stroke-width:2.2}
.topo h1{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.topo h1 em{font-style:normal;color:var(--brand)}
.topo .sub{color:#9AA0AA;font-size:11px;letter-spacing:.02em;margin-top:1px}
.acoesTopo{margin-left:auto;display:flex;align-items:center;gap:8px}
.contagem{display:inline-flex;align-items:baseline;gap:5px;background:rgba(242,169,59,.14);border:1px solid rgba(242,169,59,.32);color:#F5B851;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.contagem b{font-family:var(--fD);font-size:14px;font-variant-numeric:tabular-nums}
.btTema{position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#C9CED6;border:1px solid rgba(255,255,255,.12);transition:background var(--t),color var(--t)}
.btTema::after{content:"";position:absolute;inset:-4px}
.btTema:hover{background:rgba(255,255,255,.09);color:#fff}
.btTema svg{width:17px;height:17px}
nav{display:flex;gap:3px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none;max-width:1000px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{display:flex;align-items:center;gap:7px;padding:8px 13px;color:#A7ADB7;font-size:13.5px;font-weight:500;border-radius:99px;white-space:nowrap;min-height:44px;transition:background var(--t),color var(--t)}
nav button:hover{color:#F0ECE4;background:rgba(255,255,255,.07)}
nav button.on{color:var(--onBrand);background:var(--brand);font-weight:650}
nav button.on:hover{background:var(--brand)}

/* ---------- estrutura ---------- */
main{max-width:1000px;margin:0 auto;padding:18px 14px 72px}
section{display:none}
section.on{display:block;animation:ent .22s cubic-bezier(.32,.72,.35,1)}
@keyframes ent{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cartao{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.cartao h2{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:700;margin-bottom:12px;letter-spacing:-.01em;text-transform:none}
.cartao h2::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--brand);flex:none}
.linha{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
/* selects longos (nomes de tema) nao podem estourar o cartao */
select{max-width:100%}
.linha>select,.linha>input[type=text],.linha>input[type=search]{flex:1 1 170px;min-width:0}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:var(--onBrand);border-radius:var(--r3);padding:10px 17px;font-weight:650;font-size:14px;min-height:44px;transition:background var(--t),transform var(--t),box-shadow var(--t);box-shadow:0 1px 2px rgba(24,27,33,.14)}
.btn:hover{background:var(--brand2);color:#fff}
:root[data-tema=escuro] .btn:hover{color:var(--onBrand)}
.btn.fant{background:var(--pan);border:1px solid var(--line);color:var(--ink2);font-weight:550;box-shadow:none}
.btn.fant:hover{background:var(--pan2);border-color:var(--brandLine);color:var(--ink)}
.btn.perigo{background:var(--err);color:#fff}
.btn.perigo:hover{background:var(--err);filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.42;pointer-events:none}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border:1px solid var(--line);border-radius:99px;font-size:11.5px;font-weight:500;color:var(--mut);background:var(--pan3)}
.chip.real{color:var(--ok);border-color:var(--okLine);background:var(--okBg);font-weight:600}
.chip.aut{color:var(--mut)}
.mut{color:var(--mut)}.peq{font-size:12.5px}
.gd{font-size:27px;font-weight:700;line-height:1.05;letter-spacing:-.03em}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);text-align:left;font-weight:600;font-size:11px;padding:8px 9px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
td{padding:9px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.clic{cursor:pointer;transition:background var(--t)}
tr.clic:hover{background:var(--brandBg)}
.vermelho{color:var(--err);font-weight:600}.verde{color:var(--ok);font-weight:600}.ambar{color:var(--warn);font-weight:600}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- questões ---------- */
.q-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q-enun{font-size:16px;margin:12px 0 16px;white-space:pre-wrap;line-height:1.68;font-weight:450;letter-spacing:-.005em}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;background:var(--pan);font-size:14.5px;line-height:1.55;touch-action:pan-y;position:relative;transition:border-color var(--t),background var(--t),transform var(--t)}
.alt:hover{border-color:var(--brand);background:var(--pan3)}
.alt .letra{flex:none;width:27px;height:27px;border-radius:8px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fD);font-size:13px;font-weight:700;color:var(--mut);background:var(--pan2);transition:all var(--t)}
.alt:hover .letra{border-color:var(--brand);color:var(--brandInk)}
.alt.sel{border-color:var(--brand);background:var(--brandBg)}
.alt.sel .letra{background:var(--brand);border-color:var(--brand);color:var(--onBrand)}
.alt.certa{border-color:var(--ok);background:var(--okBg)}
.alt.certa .letra{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.errada{border-color:var(--err);background:var(--errBg)}
.alt.errada .letra{background:var(--err);border-color:var(--err);color:#fff}
.alt.riscada .txt{text-decoration:line-through;opacity:.4}
.alt .risco{margin-left:auto;flex:none;color:var(--mut);opacity:.4;padding:3px;border-radius:5px;transition:opacity var(--t),background var(--t)}
.alt .risco:hover{opacity:1;background:var(--pan2)}
.alt .risco svg{width:15px;height:15px}
.coment{border-left:3px solid var(--brand);background:var(--brandBg);border-radius:0 var(--r2) var(--r2) 0;padding:14px 16px;margin-top:14px;font-size:14.2px;line-height:1.65}
.coment .porq{margin-top:10px;padding-top:10px;border-top:1px solid var(--brandLine)}
.coment .porq div{margin-bottom:6px}
.coment .base{margin-top:10px;padding-top:10px;border-top:1px solid var(--brandLine);font-size:12.5px;color:var(--mut)}
.coment .base b{color:var(--ink2)}
.navq{display:flex;gap:9px;margin-top:16px;align-items:center}

/* ---------- simulado ---------- */
.gradeSim{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.gradeSim button{border:1.5px solid var(--line);border-radius:var(--r3);padding:9px 0;min-height:44px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mut);background:var(--pan);transition:all var(--t)}
.gradeSim button:hover{border-color:var(--brand)}
.gradeSim button.resp{background:var(--brandBg);color:var(--brandInk);border-color:var(--brandLine)}
.gradeSim button.atual{outline:2px solid var(--brand);outline-offset:2px}
.gradeSim button.certa{background:var(--okBg);color:var(--ok);border-color:var(--okLine)}
.gradeSim button.errada{background:var(--errBg);color:var(--err);border-color:var(--errLine)}
#cronSim{font-family:var(--fD);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.02em}

/* ---------- painel ---------- */
.cardsMini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.mini{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.mini::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--brand)}
.mini:nth-child(2)::before{background:var(--ok)}
.mini:nth-child(3)::before{background:var(--warn)}
.mini:nth-child(4)::before{background:var(--ink2)}
.mini .rot{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.mini .gd{font-variant-numeric:tabular-nums;margin-top:3px}
.barra{height:8px;background:var(--pan2);border-radius:99px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s cubic-bezier(.32,.72,.35,1)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--pan2)}
.heat i.h1{background:#F6DFAF}.heat i.h2{background:#F0BE6A}.heat i.h3{background:#E29215}.heat i.h4{background:#B4700A}
:root[data-tema=escuro] .heat i.h1{background:#4A3A1E}
:root[data-tema=escuro] .heat i.h2{background:#8A6218}
:root[data-tema=escuro] .heat i.h3{background:#D08F26}
:root[data-tema=escuro] .heat i.h4{background:#F2A93B}
@media (prefers-color-scheme:dark){
  :root:not([data-tema=claro]) .heat i.h1{background:#4A3A1E}
  :root:not([data-tema=claro]) .heat i.h2{background:#8A6218}
  :root:not([data-tema=claro]) .heat i.h3{background:#D08F26}
  :root:not([data-tema=claro]) .heat i.h4{background:#F2A93B}
}

/* ---------- cartões ---------- */
.flash{min-height:230px;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:20px}
.flash .frente{font-family:var(--fD);font-size:19px;font-weight:650;max-width:620px;letter-spacing:-.02em;line-height:1.35}
.flash .verso{font-size:15px;color:var(--ink);max-width:660px;white-space:pre-wrap;text-align:left;background:var(--brandBg);border:1px solid var(--brandLine);border-radius:var(--r2);padding:14px 16px;line-height:1.65}

/* ---------- erros ---------- */
#tbErros input,#tbErros textarea{width:100%;border:none;background:transparent;padding:3px 4px;font-size:13.5px;border-radius:5px;box-shadow:none}
#tbErros textarea{resize:vertical;min-height:34px}
#tbErros input:focus,#tbErros textarea:focus{background:var(--brandBg);outline:1px solid var(--brand);box-shadow:none}

/* ---------- leitura ---------- */
.grupoLei{display:flex;align-items:baseline;gap:10px;font-family:var(--fD);font-weight:700;font-size:13px;
  letter-spacing:-.01em;margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.grupoLei small{font-family:var(--fB);font-weight:400;font-size:12px;color:var(--mut);letter-spacing:0}
.leiLin{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:var(--pan);
  border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;
  box-shadow:var(--sh);transition:border-color var(--t),background var(--t)}
.leiLin:hover{border-color:var(--brand);background:var(--pan3)}
.leiMarca{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:var(--pan2);color:var(--mut);border:1px solid var(--line)}
.leiLin.lida .leiMarca{background:var(--ok);border-color:var(--ok);color:#fff}
.leiTxt{display:flex;flex-direction:column;gap:5px;min-width:0}
.leiTopo{display:flex;gap:6px;flex-wrap:wrap}
.leiTxt .tit{font-family:var(--fD);font-weight:700;font-size:15.5px;letter-spacing:-.015em;line-height:1.25}
.leiLin.lida .leiTxt .tit{color:var(--mut)}
@media(max-width:620px){.soAmplo{display:none}.leiBarra .btn{padding:9px 12px;font-size:13px}}
.leiBarra{position:sticky;top:calc(var(--hAlt,96px));z-index:30;margin-bottom:10px;padding:10px 12px}
.leiBarra .leiNome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leiBarra .btn{min-height:44px;padding:9px 13px;font-size:13.5px}
/* altura definida em JS (ajustaQuadro) para o leitor ocupar a tela exata e
   NÃO existirem duas áreas de rolagem concorrentes — só a de dentro da leitura */
#leiQuadro{display:block;width:100%;height:60vh;min-height:320px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--pan);box-shadow:var(--sh)}
body.lendo main{padding-bottom:12px}
@media(max-width:620px){.leiBarra .leiNome{display:none}}
/* ---------- teórico-prática ---------- */
.casoLin{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;background:var(--pan);transition:border-color var(--t),background var(--t)}
.casoLin:hover{border-color:var(--brand);background:var(--pan3)}
.casoLin .tit{font-weight:600;font-size:14.5px}
.casoLin .nt{margin-left:auto;flex:none;font-family:var(--fD);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.cenario{white-space:pre-wrap;line-height:1.72;background:var(--pan3);border:1px solid var(--line);border-left:3px solid var(--ink2);border-radius:0 var(--r2) var(--r2) 0;padding:14px 16px;margin:12px 0}
.perg{margin:12px 0 4px;padding-left:22px}
.perg li{margin-bottom:6px}
#prtResp{width:100%;min-height:190px;line-height:1.65;resize:vertical}
.espelho{border-left:3px solid var(--ok);background:var(--okBg);border-radius:0 var(--r2) var(--r2) 0;padding:14px 16px;margin-top:14px}
.pchave{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--okLine);font-size:14px}
.pchave:last-child{border-bottom:none}
.pchave input{margin-top:3px;flex:none}
.pchave .pz{margin-left:auto;flex:none;color:var(--mut);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
#prtNota{font-family:var(--fD);font-variant-numeric:tabular-nums}

/* ---------- nota final ---------- */
.notaG{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;font-size:14px}
.notaG .vl{font-family:var(--fD);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.notaFim{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}

/* alvos de toque: rótulo do checkbox e links de lista sobem para 44px */
label:has(> input[type=checkbox]){display:inline-flex;align-items:center;gap:7px;min-height:44px}
.cartao li > a,.cartao p > a{display:inline-block;padding:6px 0;min-height:32px}
textarea{min-height:80px}
@media(max-width:620px){
  .topo .sub{display:none}
  .contagem{padding:3px 9px;font-size:11px}

/* ================== TráfegoTítulo v1 ================== */

const dataISO=(d=new Date())=>{const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const addDiasISO=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return dataISO(d)};

/* ---------- 2.1 chave estável por conteúdo (djb2+FNV, Math.imul) ---------- */
function hashTxt(s){
  let h1=5381, h2=0x811c9dc5;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=((h1<<5)+h1+c)>>>0;
    h2=Math.imul(h2^c, 0x01000193)>>>0;
  }
  return (h1.toString(36)+h2.toString(36)).slice(0,10);
}
function chaveTxt(t){
  t=String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return hashTxt(t);
}
function chaveQ(q){ return chaveTxt(q.q); }

const BANCO=window.BANCO||[], TAXONOMIA=window.TAXONOMIA||[], FLASH=window.FLASH||[], PRATICA=window.PRATICA||[];
const QIDX=new Map(); BANCO.forEach(q=>{const ch=chaveQ(q); if(QIDX.has(ch))console.warn("COLISÃO de chave:",ch,q.q.slice(0,60)); QIDX.set(ch,q); q._ch=ch;});
const TNOME=Object.fromEntries(TAXONOMIA.map(t=>[t.id,t.nome]));

/* ---------- 2.2 blindagem de armazenamento ---------- */
const TTKEYS=["tt_resp","tt_riscos","tt_fav","tt_flash","tt_erros","tt_plano","tt_meta","tt_cfg","tt_sim","tt_simativo","tt_pos","tt_treino","tt_atividade","tt_syncmeta"];
const ARM={
  db:null, travas:{}, persistOK:null, tsBackup:0, recuperado:null,
  async boot(){
    // timeout de segurança: IDB preso (aba antiga/modo privado) não pode travar o boot
    this.db=await Promise.race([new Promise(res=>setTimeout(()=>res(null),2500)),new Promise(res=>{
      try{
        const rq=indexedDB.open("tt-db",1);
        rq.onupgradeneeded=()=>{const d=rq.result;
          if(!d.objectStoreNames.contains("espelho"))d.createObjectStore("espelho");
          if(!d.objectStoreNames.contains("backups"))d.createObjectStore("backups",{autoIncrement:true});
        };
        rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
      }catch(e){res(null)}
    })]);
    // recuperação: canário sumiu do localStorage mas o espelho IDB tem dados?
    let canario=null; try{canario=localStorage.getItem("tt_canary")}catch(e){}
    if(!canario&&this.db){
      const esp=await this.idbTudo("espelho");
      const chaves=Object.keys(esp).filter(k=>TTKEYS.includes(k));
      if(chaves.length){
        chaves.forEach(k=>{try{localStorage.setItem(k,esp[k])}catch(e){}});
        this.recuperado={n:chaves.length,quando:esp.__quando||"data desconhecida"};
      }
    }
    try{localStorage.setItem("tt_canary",new Date().toISOString())}catch(e){}
    this.idbPut("__quando",new Date().toISOString());
    if(navigator.storage&&navigator.storage.persist){
      try{this.persistOK=await navigator.storage.persist()}catch(e){this.persistOK=false}
    }
  },
  idbPut(k,v){ if(!this.db)return;
    try{this.db.transaction("espelho","readwrite").objectStore("espelho").put(v,k)}catch(e){} },
  idbTudo(loja){ return new Promise(res=>{ if(!this.db)return res({});
    try{const out={},cur=this.db.transaction(loja,"readonly").objectStore(loja).openCursor();
      cur.onsuccess=()=>{const c=cur.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};
      cur.onerror=()=>res({});
    }catch(e){res({})} }) },
  load(k,fb){
    let raw=null, falhou=false;
    try{raw=localStorage.getItem(k)}catch(e){falhou=true;this.travas[k]="leitura falhou: "+e.message}
    if(raw===null&&!falhou)return fb;          // nunca gravada: fallback é seguro
    if(!falhou){ try{return JSON.parse(raw)}catch(e){this.travas[k]="JSON corrompido"} }
    UI.banner("erro",`Falha ao ler ${k}. Gravação BLOQUEADA nessa chave para não apagar dados — exporte o backup em Ajustes.`,true);
    return fb;
  },
  save(k,v){
    if(this.travas[k]){UI.banner("erro",`Não gravei ${k}: a leitura falhou neste boot (proteção contra sobrescrita).`);return false}
    let s; try{s=JSON.stringify(v)}catch(e){return false}
    try{localStorage.setItem(k,s)}catch(e){UI.banner("erro","Armazenamento cheio/indisponível: "+e.message,true);return false}
    this.idbPut(k,s);
    const ag=Date.now();
    if(ag-this.tsBackup>10*60*1000){this.tsBackup=ag;this.snapshot("auto")}
    return true;
  },
  snapshot(motivo){ return new Promise(res=>{ if(!this.db)return res(false);
    const foto={__quando:new Date().toISOString(),__motivo:motivo||"manual"};
    TTKEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)foto[k]=v}catch(e){}});
    try{
      const tx=this.db.transaction("backups","readwrite"),st=tx.objectStore("backups");
      st.add(foto);
      const rq=st.getAllKeys();
      rq.onsuccess=()=>{const ks=rq.result;
        if(ks.length>12){const tx2=this.db.transaction("backups","readwrite");
          ks.slice(0,ks.length-12).forEach(k=>tx2.objectStore("backups").delete(k))}
        res(true)};
      rq.onerror=()=>res(false);
    }catch(e){res(false)} }) },
  listaBackups(){ return new Promise(res=>{ if(!this.db)return res([]);
    try{const out=[],cur=this.db.transaction("backups","readonly").objectStore("backups").openCursor();
      cur.onsuccess=()=>{const c=cur.result;
        if(c){out.push({id:c.key,quando:c.value.__quando,motivo:c.value.__motivo,
          n:Object.keys(c.value).filter(k=>k.startsWith("rt_")).length});c.continue()}
        else res(out.reverse())};
      cur.onerror=()=>res([]);
    }catch(e){res([])} }) },
  restaura(id){ return new Promise(res=>{ if(!this.db)return res(false);
    try{const rq=this.db.transaction("backups","readonly").objectStore("backups").get(id);
      rq.onsuccess=async()=>{const foto=rq.result;if(!foto)return res(false);
        await this.snapshot("antes-de-restaurar");
        Object.keys(foto).filter(k=>k.startsWith("rt_")).forEach(k=>{try{localStorage.setItem(k,foto[k])}catch(e){}});
        res(true)};
      rq.onerror=()=>res(false);
    }catch(e){res(false)} }) },
  exporta(){ const out={__app:"trafego-titulo",__v:V,__quando:new Date().toISOString()};
    TTKEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)out[k]=v}catch(e){}});
    return out },
  async importa(obj){ if(!obj||obj.__app!=="trafego-titulo")return null;
    await this.snapshot("antes-de-importar");
    let n=0;
    TTKEYS.forEach(k=>{ if(typeof obj[k]==="string"){
      try{JSON.parse(obj[k])}catch(e){return}
      try{localStorage.setItem(k,obj[k]);this.idbPut(k,obj[k]);n++}catch(e){} }});
    return n }
};

/* ---------- ordem das questões ----------
   Dois defeitos corrigidos aqui:
   1) o banco é montado leva a leva e cada leva é temática — na ordem crua havia até
      16 questões seguidas do mesmo tema (342 dos 503 pares adjacentes);
   2) `sort(()=>Math.random()-0.5)` NÃO embaralha de verdade: o comparador é
      inconsistente e o TimSort do V8 deixa o começo do vetor sobrerrepresentado
      (medido: as 50 primeiras posições saíam 47% mais do 1º terço que do último).
      Isso enviesava sobretudo o SORTEIO DO SIMULADO. */

/* Fisher-Yates — permutação uniforme, no lugar */
function embaralha(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* Espalha os temas: a cada passo tira do tema com MAIS questões restantes, evitando
   repetir o tema anterior. Só repete quando é matematicamente inevitável (um tema
   com mais da metade do que sobrou). Dentro do tema, a ordem é aleatória. */
function espalhaTemas(lista){
  const grupos=new Map();
  lista.forEach(q=>{
    const k=q.tema||"_";
    if(!grupos.has(k))grupos.set(k,[]);
    grupos.get(k).push(q);
  });
  grupos.forEach(v=>embaralha(v));
  const out=[]; let anterior=null;
  while(out.length<lista.length){
    /* sorteio PONDERADO pelo que resta de cada tema, proibindo repetir o anterior.
       Pegar sempre o maior (versão determinística) produzia pingue-pongue entre os
       dois temas mais numerosos — só 3 temas distintos nas 20 primeiras. Com o
       sorteio ponderado os temas ficam espalhados E variados, e ainda assim todos
       se esgotam junto no fim. */
    const cand=[]; let peso=0;
    grupos.forEach((v,k)=>{ if(v.length&&k!==anterior){cand.push([k,v.length]);peso+=v.length} });
    let escolhido=null;
    if(cand.length){
      let r=Math.random()*peso;
      for(const [k,n] of cand){ r-=n; if(r<=0){escolhido=k;break} }
      if(escolhido===null)escolhido=cand[cand.length-1][0];
    }else{
      grupos.forEach((v,k)=>{ if(v.length)escolhido=k });   // só sobrou o anterior
    }
    out.push(grupos.get(escolhido).pop());
    anterior=escolhido;
  }
  return out;
}

/* assinatura do filtro: muda o filtro, refaz a ordem */
function assinaturaQ(f,n){return [f.tema,f.status,f.real?1:0,n].join("|")}

/* ================== QUESTÕES ================== */
const QST={lista:[],idx:0,respondida:false,selecionada:null};
function filtrosQ(){
  const f=ST.pos.fq||{};
  return {tema:f.tema||"",status:f.status||"todas",real:!!f.real};
}
function aplicaFiltroQ(refazOrdem){
  const f=filtrosQ();
  QST.lista=BANCO.filter(q=>{
    if(f.tema&&q.tema!==f.tema)return false;
    if(f.real&&!q.fonte)return false;
    const r=respostaDe(q);
    if(f.status==="nao"&&r)return false;
    if(f.status==="erradas"&&!(r&&r.hist.length&&!r.hist[r.hist.length-1].ok))return false;
    if(f.status==="favoritas"&&!ST.fav[q._ch])return false;
    return true;
  });
  ordenaQuestoes(f,refazOrdem);
}

/* Mantém a MESMA ordem enquanto o filtro não muda (navegar e recarregar não
   reembaralham), mas com os temas espalhados desde a primeira abertura. */
function ordenaQuestoes(f,refazOrdem){
  const ass=assinaturaQ(f,QST.lista.length);
  const salva=ST.pos.ordq;
  if(!refazOrdem&&ST.pos.assq===ass&&Array.isArray(salva)){
    const porCh=new Map(QST.lista.map(q=>[q._ch,q]));
    const ord=[];
    salva.forEach(ch=>{const q=porCh.get(ch);if(q){ord.push(q);porCh.delete(ch)}});
    if(porCh.size)espalhaTemas([...porCh.values()]).forEach(q=>ord.push(q)); // questões novas do banco
    if(ord.length===QST.lista.length){QST.lista=ord;return}
  }
  QST.lista=espalhaTemas(QST.lista);
  ST.pos.assq=ass;
  ST.pos.ordq=QST.lista.map(q=>q._ch);
  ARM.save("tt_pos",ST.pos);
}

function ligaAlternativa(el,q){
  const i=+el.dataset.i;
  el.querySelector(".risco").onclick=e=>{e.stopPropagation();toggleRisco(q,i)};
  // arrastar para o lado risca (toque e mouse); clique seleciona
  let x0=null,y0=null,arrastou=false;
  el.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY;arrastou=false});
  el.addEventListener("pointermove",e=>{
    if(x0===null||QST.respondida)return;
    if(Math.abs(e.clientX-x0)>56&&Math.abs(e.clientY-y0)<28&&!arrastou){arrastou=true;toggleRisco(q,i)}
  });
  el.addEventListener("pointerup",()=>{setTimeout(()=>{x0=null},0)});
  el.addEventListener("click",()=>{
    if(arrastou||QST.respondida)return;
    if((ST.riscos[q._ch]||[]).includes(i))return;
    QST.selecionada=i;
    document.querySelectorAll("#qAlts .alt").forEach(a=>a.classList.toggle("sel",+a.dataset.i===i));
    $("#qResp").disabled=false;
  });
}
function toggleRisco(q,i){
  const r=ST.riscos[q._ch]||(ST.riscos[q._ch]=[]);
  const p=r.indexOf(i);
  if(p>=0)r.splice(p,1);else{r.push(i);if(QST.selecionada===i){QST.selecionada=null;$("#qResp").disabled=true}}
  if(!r.length)delete ST.riscos[q._ch];
  ARM.save("tt_riscos",ST.riscos);
  const el=document.querySelector(`#qAlts .alt[data-i="${i}"]`);
  if(el){el.classList.toggle("riscada",p<0);el.classList.remove("sel")}
}
function respondeQuestao(q){
  if(QST.selecionada===null||QST.respondida)return;
  QST.respondida=true;
  const ok=QST.selecionada===q.gab;
  registraResposta(q,QST.selecionada,ok,"estudo");
  document.querySelectorAll("#qAlts .alt").forEach(el=>{
    const i=+el.dataset.i;
    if(i===q.gab)el.classList.add("certa");
    else if(i===QST.selecionada)el.classList.add("errada");
  });
  $("#qResp").disabled=true;
  $("#qFeed").innerHTML=`<div class="coment">
    <b class="${ok?"verde":"vermelho"}">${ok?"Acertou.":"Errou — gabarito "+LETRAS[q.gab]+"."}</b>
    <div style="margin-top:6px">${esc(q.coment)}</div>
    ${q.porAlt?`<div class="porq">${q.porAlt.map((p,i)=>`<div><b>${LETRAS[i]})</b> ${esc(p)}</div>`).join("")}</div>`:""}
    ${q.base?`<div class="base"><b>Base:</b> ${esc(q.base)}</div>`:""}
    ${ok?"":`<div style="margin-top:10px"><button class="btn fant" id="qLog">Anotar no log de erros</button></div>`}
  </div>`;
  const bl=$("#qLog");
  if(bl)bl.onclick=()=>{
    ST.erros.unshift({id:novoIdLinha(),d:dataISO(),tema:q.tema,ref:q._ch,oque:(q.sub||q.tema)+": "+q.q.slice(0,80)+"…",porque:"",licao:""});
    ARM.save("tt_erros",ST.erros);
    UI.banner("info","Anotado no log de erros — complete o motivo e a lição na aba Erros.");
    bl.disabled=true;
  };
}

/* ================== PAINEL ================== */
function incidencia(){
  const reais=BANCO.filter(q=>q.fonte);
  if(reais.length<10)return {uniforme:true,map:Object.fromEntries(TAXONOMIA.map(t=>[t.id,1/TAXONOMIA.length]))};
  const m={};TAXONOMIA.forEach(t=>m[t.id]=reais.filter(q=>q.tema===t.id).length/reais.length);
  return {uniforme:false,map:m};
}
function statsTema(){
  const por={};
  for(const [ch,r] of Object.entries(ST.resp)){
    const q=QIDX.get(ch);if(!q)continue;          // chave órfã: ignora (falha segura)
    (por[q.tema]=por[q.tema]||[]).push(...r.hist);
  }
  return por;
}
function revisaoTemas(){
  const por=statsTema();
  return TAXONOMIA.map(t=>{
    const hs=(por[t.id]||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
    if(!hs.length)return {t,nunca:true};
    const ult=hs[hs.length-1].d,u20=hs.slice(-20);
    const acc=u20.filter(h=>h.ok).length/u20.length;
    const iv=Math.max(1,Math.min(15,Math.round(1+14*acc*acc)));
    const due=addDiasISO(ult,iv);
    return {t,ult,acc,iv,due,atrasado:due<dataISO()};
  });
}
function ofensiva(){
  let d=new Date(),n=0;
  if(!ST.atividade[dataISO(d)])d.setDate(d.getDate()-1);
  while(ST.atividade[dataISO(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}

  // cobertura do banco

  // prática descritiva

  <div class="cartao">

    <div class="rolagem"><table>

 {id:"assoc",rot:"Associação a sociedade médica da área",op:[["0","Não",0],["s","Sim",10]]}
];
const CURRIC_MAX=CURRIC.reduce((a,c)=>a+Math.max(...c.op.map(o=>o[2])),0);
function pontosCurriculo(){
  const c=ST.cfg.curric||{};
  return CURRIC.reduce((a,g)=>{const v=c[g.id],o=g.op.find(x=>x[0]===v);return a+(o?o[2]:0)},0);
}
function notaSimulada(){
  // teórica: acerto nos simulados recentes (ou geral, se não houver simulado)
  const sims=ST.sim.slice(-3);
  let teor=null;
  if(sims.length)teor=sims.reduce((a,s)=>a+s.nota,0)/sims.length/10;
  else{const h=Object.values(ST.resp).flatMap(r=>r.hist);if(h.length>=10)teor=h.filter(x=>x.ok).length/h.length*10}
  // teórico-prática: média dos casos corrigidos
  const cs=Object.values(ST.treino).filter(t=>t.d&&t.nota!==undefined);
  const prat=cs.length?cs.reduce((a,t)=>a+t.nota,0)/cs.length:null;
  // currículo: pontos convertidos para 0–10 (a régua oficial da banca não é publicada;
  // aqui é proporção sobre o teto do Anexo I — serve para comparar cenários, não é a nota real)
  const cur=CURRIC_MAX?Math.min(10,pontosCurriculo()/CURRIC_MAX*10):0;
  const fim=(teor===null||prat===null)?null:(teor*0.6+prat*0.3+cur*0.1);
  return {teor,prat,cur,fim,pontos:pontosCurriculo()};
}
/* ================== CARTÕES (SM-2 simplificado) ================== */
function sm2(st,nota){
  if(nota<3){st.reps=0;st.iv=1}
  else{st.reps=(st.reps||0)+1;st.iv=st.reps===1?1:st.reps===2?6:Math.round((st.iv||1)*(st.ef||2.5))}
  st.ef=Math.max(1.3,(st.ef||2.5)+(0.1-(5-nota)*(0.08+(5-nota)*0.02)));
  st.due=addDiasISO(dataISO(),st.iv);
  st.ts=Date.now();
  return st;
}

      ${ST.erros.map((e,i)=>`<tr>
        <td><input data-i="${i}" data-c="d" value="${esc(e.d)}"></td>
        <td><select data-i="${i}" data-c="tema">${TAXONOMIA.map(t=>`<option value="${t.id}" ${e.tema===t.id?"selected":""}>${esc(t.nome)}</option>`).join("")}</select></td>
        <td><textarea data-i="${i}" data-c="oque">${esc(e.oque)}</textarea></td>
        <td><textarea data-i="${i}" data-c="porque">${esc(e.porque)}</textarea></td>
        <td><textarea data-i="${i}" data-c="licao">${esc(e.licao)}</textarea></td>
        <td><button data-del="${i}" title="Excluir" class="vermelho">✕</button></td>
      </tr>`).join("")}
    </table></div>
    ${ST.erros.length?"":'<p class="mut peq" style="margin-top:8px">Vazio. Erros anotados nas questões caem aqui.</p>'}
  </div>`;
  sec.querySelectorAll("input[data-c],textarea[data-c],select[data-c]").forEach(el=>{
    el.onchange=()=>{ST.erros[+el.dataset.i][el.dataset.c]=el.value;ARM.save("tt_erros",ST.erros)};
  });
  sec.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(!confirm("Excluir esta linha do log?"))return;
    ST.erros.splice(+b.dataset.del,1);ARM.save("tt_erros",ST.erros);montaErros();
  });
  $("#errAdd").onclick=()=>{ST.erros.unshift({id:novoIdLinha(),d:dataISO(),tema:TAXONOMIA[0].id,oque:"",porque:"",licao:""});ARM.save("tt_erros",ST.erros);montaErros()};
  $("#errCSV").onclick=()=>{
    const cab="data;tema;o_que_errei;por_que;licao";
    const li=ST.erros.map(e=>[e.d,TNOME[e.tema]||e.tema,e.oque,e.porque,e.licao]
      .map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(";"));
    baixaArquivo("trafego-titulo-erros-"+dataISO()+".csv",[cab,...li].join("\n"),"text/csv");
  };
}

/* ================== PLANO ================== */
function montaPlano(){
  const sec=$("#sec-plano");
  const hj=dataISO();
  const plano=ST.plano.slice().sort((a,b)=>a.d<b.d?-1:1);
  sec.innerHTML=`<div class="cartao">
    <div class="linha" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">Cronograma vivo</h2>
      <div class="linha">
        <button class="btn fant" id="plGera">Gerar rascunho até a prova</button>
        <button class="btn" id="plAdd">Adicionar dia</button>
      </div>
    </div>
    ${plano.length?`<div class="rolagem"><table>
      <tr><th style="width:110px">Data</th><th>Tema</th><th style="width:60px">Feito</th><th style="width:90px"></th><th></th></tr>
      ${plano.map(p=>{const i=ST.plano.indexOf(p);
        const cls=p.feito?"verde":(p.d<hj?"vermelho":(p.d===hj?"ambar":""));
        return `<tr>
        <td class="${cls}">${p.d===hj?"<b>hoje</b> ":""}${esc(p.d)}</td>
        <td><select data-i="${i}" data-c="tema">${TAXONOMIA.map(t=>`<option value="${t.id}" ${p.tema===t.id?"selected":""}>${esc(t.nome)}</option>`).join("")}</select></td>
        <td><input type="checkbox" data-i="${i}" data-c="feito" ${p.feito?"checked":""}></td>
        <td><button class="btn fant peq" data-vai="${p.tema}">questões</button></td>
        <td><button data-del="${i}" class="vermelho" title="Excluir">✕</button></td></tr>`}).join("")}
    </table></div>`:'<p class="mut peq">Sem plano ainda. Defina a data da prova no Painel e gere o rascunho, ou adicione dias manualmente.</p>'}
  </div>`;
  $("#plAdd").onclick=()=>{ST.plano.push({id:novoIdLinha(),d:hj,tema:TAXONOMIA[0].id,feito:false});ARM.save("tt_plano",ST.plano);montaPlano()};
  $("#plGera").onclick=()=>{
    if(!ST.meta.dataProva){UI.banner("info","Defina a data da prova no Painel primeiro.");return}
    if(ST.plano.length&&!confirm("Substituir o plano atual pelo rascunho gerado? (dias já feitos são preservados)"))return;
    const inc=incidencia(),por=statsTema();
    const ordem=TAXONOMIA.map(t=>{const acc=taxaAcerto(por[t.id]||[]);
      return {id:t.id,pri:(inc.map[t.id]||0)*(acc===null?0.7:1-acc)}}).sort((a,b)=>b.pri-a.pri).map(x=>x.id);
    const feitos=Object.fromEntries(ST.plano.filter(p=>p.feito).map(p=>[p.d+"|"+p.tema,true]));
    const novo=[];let d=hj,i=0;
    while(d<ST.meta.dataProva){novo.push({id:novoIdLinha(),d,tema:ordem[i%ordem.length],feito:!!feitos[d+"|"+ordem[i%ordem.length]]});d=addDiasISO(d,1);i++}
    ST.plano=novo;ARM.save("tt_plano",ST.plano);montaPlano();
  };
  sec.querySelectorAll("select[data-c],input[data-c]").forEach(el=>{
    el.onchange=()=>{const p=ST.plano[+el.dataset.i];
      if(el.dataset.c==="feito")p.feito=el.checked;else p[el.dataset.c]=el.value;
      ARM.save("tt_plano",ST.plano);montaPlano()};
  });
  sec.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ST.plano.splice(+b.dataset.del,1);ARM.save("tt_plano",ST.plano);montaPlano()});
  sec.querySelectorAll("[data-vai]").forEach(b=>b.onclick=()=>{
    ST.pos.fq={tema:b.dataset.vai,status:"todas",real:false};ST.pos.chq=null;ARM.save("tt_pos",ST.pos);irAba("questoes")});
}

/* ================== AJUSTES ================== */
async function montaAjustes(){
  const sec=$("#sec-ajustes");
  let uso="";
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    uso=`${(e.usage/1048576).toFixed(1)} MB usados de ~${(e.quota/1048576).toFixed(0)} MB`}}catch(e){}
  const bks=await ARM.listaBackups();
  sec.innerHTML=`
  <div id="slotSync"></div>
  <div class="cartao"><h2>Proteção de dados</h2>
    <table>
      <tr><td>Armazenamento persistente</td><td>${ARM.persistOK===true?'<span class="verde">concedido</span>':ARM.persistOK===false?'<span class="ambar">negado pelo navegador (comum no iPhone) — o espelho IndexedDB e os backups cobrem</span>':"—"}</td></tr>
      <tr><td>Espelho IndexedDB</td><td>${ARM.db?'<span class="verde">ativo</span>':'<span class="vermelho">indisponível</span>'}</td></tr>
      <tr><td>Uso de armazenamento</td><td>${uso||"—"}</td></tr>
      <tr><td>Chaves travadas</td><td>${Object.keys(ARM.travas).length?'<span class="vermelho">'+esc(Object.keys(ARM.travas).join(", "))+"</span>":'<span class="verde">nenhuma</span>'}</td></tr>
    </table>
    <div class="linha" style="margin-top:10px">
      <button class="btn" id="ajExporta">Exportar backup (.json)</button>
      <label class="btn fant" style="cursor:pointer">Importar backup<input type="file" id="ajImporta" accept=".json,application/json" hidden></label>
      <button class="btn fant" id="ajSnap">Criar backup interno agora</button>
    </div>
  </div>
  <div class="cartao"><h2>Backups internos (últimos ${bks.length})</h2>
    ${bks.length?`<div class="rolagem"><table><tr><th>Quando</th><th>Motivo</th><th>Chaves</th><th></th></tr>
      ${bks.map(b=>`<tr><td>${esc((b.quando||"").replace("T"," ").slice(0,16))}</td><td>${esc(b.motivo)}</td><td>${b.n}</td>
        <td><button class="btn fant peq" data-rest="${b.id}">restaurar</button></td></tr>`).join("")}</table></div>`
      :'<p class="mut peq">Nenhum ainda — são criados automaticamente durante o uso.</p>'}
  </div>
  <div class="cartao"><h2>Aplicativo</h2>
    <table>
      <tr><td>Versão</td><td>${V}</td></tr>
      <tr><td>Banco</td><td>${BANCO.length} questões • ${FLASH.length} cartões • ${PRATICA.length} casos descritivos</td></tr>
      <tr><td>Edital de referência</td><td><a href="docs/edital-2446-abramet-2026.pdf" target="_blank" rel="noopener">Edital nº 2446 — AMB/ABRAMET 2026</a></td></tr>
      <tr><td>Norma-base do exame</td><td><a href="docs/contran-res-927-2022.pdf" target="_blank" rel="noopener">Resolução CONTRAN nº 927/2022</a></td></tr>
    </table>
    <div class="linha" style="margin-top:10px">
      <button class="btn fant" id="ajAtualiza">Buscar atualização</button>
    </div>
  </div>`;
  
  $("#ajExporta").onclick=()=>baixaArquivo("trafego-titulo-backup-"+dataISO()+".json",JSON.stringify(ARM.exporta(),null,1),"application/json");
  $("#ajImporta").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const obj=JSON.parse(await f.text());
      const n=await ARM.importa(obj);
      if(n===null){UI.banner("erro","Esse arquivo não parece um backup do TráfegoTítulo.");return}
      carregaEstado();UI.banner("ok",`Backup importado: ${n} chaves restauradas (o estado anterior virou backup interno).`);
      montaAjustes();
    }catch(err){UI.banner("erro","Não consegui ler o arquivo: "+err.message)}
  };
  $("#ajSnap").onclick=async()=>{await ARM.snapshot("manual");UI.banner("ok","Backup interno criado.");montaAjustes()};
  sec.querySelectorAll("[data-rest]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Restaurar este backup? O estado atual vira um novo backup interno antes."))return;
    const ok=await ARM.restaura(+b.dataset.rest);
    if(ok){carregaEstado();UI.banner("ok","Backup restaurado.");montaAjustes()}else UI.banner("erro","Não consegui restaurar.");
  });
  $("#ajAtualiza").onclick=async()=>{
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.update()));
      UI.banner("info","Verificação de atualização disparada — recarregando…");
      setTimeout(()=>location.reload(),800);
    }catch(e){location.reload()}
  };
}

/* ---------- util ---------- */
function baixaArquivo(nome,conteudo,tipo){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));
  a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- tema claro/escuro ---------- */
const SOL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>';
const LUA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.6 8.6 0 0 1 9.5 3.5a8.6 8.6 0 1 0 11 11z"/></svg>';
function escuroAgora(){
  const t=document.documentElement.dataset.tema;
  if(t)return t==="escuro";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function pintaBotaoTema(){ const b=$("#btTema"); if(b)b.innerHTML=escuroAgora()?SOL:LUA; }
function iniciaTema(){
  pintaBotaoTema();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",pintaBotaoTema);
  $("#btTema").onclick=()=>{
    const novo=escuroAgora()?"claro":"escuro";
    document.documentElement.dataset.tema=novo;
    try{localStorage.setItem("tt_tema",novo)}catch(e){}
    pintaBotaoTema();
    avisaTemaLeitura(novo);
  };
}

/* ---------- contagem regressiva para a prova ---------- */
function pintaContagem(){
  const el=$("#contagem"); if(!el)return;
  const d=ST.meta&&ST.meta.dataProva;
  if(!d){el.hidden=true;return}
  const dias=Math.ceil((new Date(d+"T12:00:00")-new Date())/86400000);
  el.hidden=false;
  if(dias>1) el.innerHTML=`faltam <b>${dias}</b> dias`;
  else if(dias===1) el.innerHTML="<b>amanhã</b>";
  else if(dias===0) el.innerHTML="<b>é hoje</b>";
  else el.innerHTML="prova realizada";
}

/* ---------- boot ---------- */
(async function boot(){
  await ARM.boot();
  carregaEstado();
  montaAbas();
  $("#subTopo").textContent=`v${V} • ${BANCO.length} questões • ${PRATICA.length} casos`;
  iniciaTema();
  pintaContagem();
  if(ARM.recuperado)UI.banner("ok",`Dados recuperados do espelho interno (IndexedDB): ${ARM.recuperado.n} chaves, último espelho de ${ARM.recuperado.quando.slice(0,16).replace("T"," ")}. O localStorage tinha sido apagado pelo navegador.`,true);
  if(ARM.persistOK===false)console.warn("storage.persist() negado — comum no iOS; espelho IDB ativo.");
  if(ST.simativo&&!ST.simativo.fim)UI.banner("info","Há um simulado em andamento — retome na aba Simulado.");
  /* deep link vindo das leituras: ?area=<tema> abre Questões já filtrado */
  try{
    const area=new URLSearchParams(location.search).get("area");
    if(area&&TAXONOMIA.some(t=>t.id===area)){
      ST.pos.fq={tema:area,status:"todas",real:false};ST.pos.chq=null;
      ARM.save("tt_pos",ST.pos);
      history.replaceState(null,"",location.pathname+"#questoes");
    }
  }catch(e){}
  const h=location.hash.slice(1);
  irAba(ABAS.some(a=>a[0]===h)?h:(ST.pos.aba&&ABAS.some(a=>a[0]===ST.pos.aba)?ST.pos.aba:"questoes"),false);
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
  ARM.snapshot("boot");
  window.__ttPronto=true;window.dispatchEvent(new Event("tt-pronto"));
})();

/* ganchos de teste (verificação por DOM) */
window.__tt={get ST(){return ST},ARM,chaveQ,chaveTxt,QIDX,irAba,registraResposta,V,escuroAgora,pintaContagem,embaralha,espalhaTemas,get QST(){return QST}};
</script>
