<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14171D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F14" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TráfegoTítulo">
<title>TráfegoTítulo</title>
<!-- conta + sincronização (cópia de ~/Documents/Claude/_mtsync/). Síncrono no <head>: o portão
     cobre a tela antes do primeiro pixel do app e só sai com a conta confirmada. -->
<script src="mtsync.js"></script>
<script>try{var _t=localStorage.getItem("tt_tema");if(_t)document.documentElement.dataset.tema=_t}catch(e){}</script>
<style>
/* Inter servida pelo próprio app (fonts/, latim enxuto, OFL em fonts/OFL.txt): nada de Google Fonts. */
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-500.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-700.woff2) format("woff2")}
/* ===== TráfegoTítulo — identidade "Asfalto & Sinalização" =====
   Ink = asfalto. Âmbar = placa de advertência. Verde = rodovia. Vermelho = parada.
   As cores semânticas SÃO as cores da sinalização viária — nada é decorativo. */
:root{
  color-scheme:light;
  --bg:#F5F1E8; --pan:#FFFFFF; --pan2:#EFEADE; --pan3:#FAF7F0;
  --line:#E1DACA; --line2:#EDE7D9;
  --ink:#181B21; --ink2:#3A414B; --mut:#6E6759;
  --brand:#E29215; --brand2:#C77A0B; --brandInk:#8A5108; --brandBg:#FDF3E1; --brandLine:#F0D6A2;
  --ok:#1B7A45; --okBg:#E9F5ED; --okLine:#A6D8BA;
  --err:#C0261F; --errBg:#FBEDEB; --errLine:#E9B0AB;
  --warn:#A9600A; --warnBg:#FBF1DF;
  --onBrand:#20170A;
  --sh:0 1px 2px rgba(24,27,33,.05),0 6px 16px -10px rgba(24,27,33,.18);
  --sh2:0 2px 6px rgba(24,27,33,.08),0 18px 36px -16px rgba(24,27,33,.28);
  --r:12px; --r2:9px; --r3:7px;
  --fB:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fD:var(--fB); /* tt-v16: a Archivo (fonte de display do Google) saiu; títulos e números em Inter */
  --t:160ms cubic-bezier(.32,.72,.35,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema=claro]){
    color-scheme:dark;
    --bg:#101318; --pan:#171B22; --pan2:#1F242D; --pan3:#141821;
    --line:#2D343F; --line2:#232932;
    --ink:#ECE8E0; --ink2:#C5CAD3; --mut:#929AA6;
    --brand:#F2A93B; --brand2:#FFC168; --brandInk:#F2A93B; --brandBg:#2A2115; --brandLine:#4A3A1E;
    --ok:#4FCB85; --okBg:#13261C; --okLine:#2D5C42;
    --err:#F0736A; --errBg:#2A1716; --errLine:#5E312D;
    --warn:#E8A33D; --warnBg:#2A2115;
    --onBrand:#1A1206;
    --sh:0 1px 2px rgba(0,0,0,.45),0 8px 20px -12px rgba(0,0,0,.8);
    --sh2:0 2px 8px rgba(0,0,0,.5),0 22px 40px -18px rgba(0,0,0,.9);
  }
}
:root[data-tema=escuro]{
  color-scheme:dark;
  --bg:#101318; --pan:#171B22; --pan2:#1F242D; --pan3:#141821;
  --line:#2D343F; --line2:#232932;
  --ink:#ECE8E0; --ink2:#C5CAD3; --mut:#929AA6;
  --brand:#F2A93B; --brand2:#FFC168; --brandInk:#F2A93B; --brandBg:#2A2115; --brandLine:#4A3A1E;
  --ok:#4FCB85; --okBg:#13261C; --okLine:#2D5C42;
  --err:#F0736A; --errBg:#2A1716; --errLine:#5E312D;
  --warn:#E8A33D; --warnBg:#2A2115;
  --onBrand:#1A1206;
  --sh:0 1px 2px rgba(0,0,0,.45),0 8px 20px -12px rgba(0,0,0,.8);
  --sh2:0 2px 8px rgba(0,0,0,.5),0 22px 40px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--fB);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
h1,h2,h3,.gd,.num{font-family:var(--fD);letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-size:16px;font-family:inherit;background:var(--pan);color:var(--ink);border:1px solid var(--line);border-radius:var(--r3);padding:11px 12px;min-height:44px;transition:border-color var(--t),box-shadow var(--t)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.alt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandBg)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--brand)}
a{color:var(--brandInk);text-underline-offset:2px}
svg.ic{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--brand);color:var(--onBrand)}

/* ---------- faixas de aviso ---------- */
#faixas{position:sticky;top:0;z-index:60}
.faixa{display:flex;gap:10px;align-items:flex-start;padding:11px 16px;font-size:13.5px;font-weight:500;border-bottom:1px solid var(--line)}
.faixa.ok{background:var(--okBg);color:var(--ok);border-bottom-color:var(--okLine)}
.faixa.erro{background:var(--errBg);color:var(--err);border-bottom-color:var(--errLine)}
.faixa.info{background:var(--brandBg);color:var(--brandInk);border-bottom-color:var(--brandLine)}
.faixa button{margin-left:auto;color:inherit;opacity:.65;font-size:16px;padding:0 4px}
.faixa button:hover{opacity:1}

/* ---------- cabeçalho asfalto ---------- */
header{position:sticky;top:0;z-index:50;background:#14171D;color:#EFEBE3;box-shadow:0 1px 0 rgba(0,0,0,.25),0 6px 20px -14px rgba(0,0,0,.9)}
.topo{display:flex;align-items:center;gap:11px;padding:11px 16px 9px;max-width:1000px;margin:0 auto}
.marca{width:29px;height:29px;border-radius:8px;background:var(--brand);color:#20170A;display:grid;place-items:center;flex:none}
.marca svg{width:19px;height:19px;stroke-width:2.2}
.topo .nome{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.topo .nome em{font-style:normal;color:var(--brand)}
.topo .sub{color:#9AA0AA;font-size:11px;letter-spacing:.02em;margin-top:1px}
.acoesTopo{margin-left:auto;display:flex;align-items:center;gap:8px}
.contagem{display:inline-flex;align-items:baseline;gap:5px;background:rgba(242,169,59,.14);border:1px solid rgba(242,169,59,.32);color:#F5B851;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.contagem b{font-family:var(--fD);font-size:14px;font-variant-numeric:tabular-nums}
.btTema{position:relative;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#C9CED6;border:1px solid rgba(255,255,255,.12);transition:background var(--t),color var(--t)}
.btTema::after{content:"";position:absolute;inset:-4px}
.btTema:hover{background:rgba(255,255,255,.09);color:#fff}
.btTema svg{width:17px;height:17px}
nav{display:flex;gap:3px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none;max-width:1000px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{display:flex;align-items:center;gap:7px;padding:8px 13px;color:#A7ADB7;font-size:13.5px;font-weight:500;border-radius:99px;white-space:nowrap;min-height:44px;transition:background var(--t),color var(--t)}
nav button:hover{color:#F0ECE4;background:rgba(255,255,255,.07)}
nav button.on{color:var(--onBrand);background:var(--brand);font-weight:650}
nav button.on:hover{background:var(--brand)}

/* ---------- áreas seguras do iOS ----------
   As metas apple-mobile-web-app-status-bar-style=black-translucent + viewport-fit=cover
   fazem o app desenhar POR BAIXO do relógio/bateria e do entalhe. Sem estes paddings,
   o logo e as abas ficavam cobertos no PWA instalado. */
header{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
main{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}

/* ---------- barra de abas inferior (celular) ----------
   No celular, 9 abas numa rolagem lateral deixavam 6 invisíveis. Padrão de app:
   4 destinos principais + "Mais", presos embaixo, ao alcance do polegar. */
#barraAbas{display:none}
@media(max-width:720px){
  header nav#abas{display:none}
  .topo{padding-bottom:11px}
  #barraAbas{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;
    background:#14171D;border-top:1px solid rgba(255,255,255,.08);
    padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
    box-shadow:0 -8px 24px -16px rgba(0,0,0,.8)}
  #barraAbas button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:52px;border-radius:12px;color:#A7ADB7;font-size:11px;font-weight:600;letter-spacing:.01em;
    transition:color var(--t),background var(--t)}
  #barraAbas button svg{width:22px;height:22px}
  #barraAbas button.on,#barraAbas button.on:hover{color:var(--brand);background:rgba(242,169,59,.13)}
  #barraAbas button:hover{background:rgba(255,255,255,.05);color:#F0ECE4}
  #barraAbas button.on svg{stroke-width:2.4}
  #barraAbas button:active{background:rgba(255,255,255,.06)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  body.lendo main{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  #faixas{top:env(safe-area-inset-top)}
}
#maisFundo{position:fixed;inset:0;z-index:70;background:rgba(8,10,14,.55);animation:fadeIn .16s ease-out}
#maisFolha{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--pan);color:var(--ink);
  border-radius:18px 18px 0 0;padding:10px 14px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px -10px rgba(0,0,0,.45);animation:sobe .2s cubic-bezier(.32,.72,.35,1)}
#maisFolha .alca{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
#maisFolha h2{font-size:14px;color:var(--ink2);font-weight:600;margin:0 4px 10px}
#maisFolha .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#maisFolha .grade button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;min-height:78px;
  border:1px solid var(--line);border-radius:14px;background:var(--pan3);font-size:13px;font-weight:600;color:var(--ink2)}
#maisFolha .grade button svg{width:22px;height:22px;color:var(--brandInk)}
#maisFolha .grade button.on{border-color:var(--brand);background:var(--brandBg);color:var(--ink)}
@keyframes sobe{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- estrutura ---------- */
main{max-width:1000px;margin:0 auto;padding:18px 14px 72px}
section{display:none}
section.on{display:block;animation:ent .22s cubic-bezier(.32,.72,.35,1)}
@keyframes ent{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cartao{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.cartao h2{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:700;margin-bottom:12px;letter-spacing:-.01em;text-transform:none}
.cartao h2::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--brand);flex:none}
.linha{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
/* selects longos (nomes de tema) nao podem estourar o cartao */
select{max-width:100%}
.linha>select,.linha>input[type=text],.linha>input[type=search]{flex:1 1 170px;min-width:0}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:var(--onBrand);border-radius:var(--r3);padding:10px 17px;font-weight:650;font-size:14px;min-height:44px;transition:background var(--t),transform var(--t),box-shadow var(--t);box-shadow:0 1px 2px rgba(24,27,33,.14)}
.btn:hover{background:var(--brand2);color:#fff}
:root[data-tema=escuro] .btn:hover{color:var(--onBrand)}
.btn.fant{background:var(--pan);border:1px solid var(--line);color:var(--ink2);font-weight:550;box-shadow:none}
.btn.fant:hover{background:var(--pan2);border-color:var(--brandLine);color:var(--ink)}
.btn.perigo{background:var(--err);color:#fff}
.btn.perigo:hover{background:var(--err);filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.42;pointer-events:none}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border:1px solid var(--line);border-radius:99px;font-size:11.5px;font-weight:500;color:var(--mut);background:var(--pan3)}
.chip.real{color:var(--ok);border-color:var(--okLine);background:var(--okBg);font-weight:600}
.chip.aut{color:var(--mut)}
.mut{color:var(--mut)}.peq{font-size:12.5px}
.gd{font-size:27px;font-weight:700;line-height:1.05;letter-spacing:-.03em}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);text-align:left;font-weight:600;font-size:12.5px;padding:8px 9px;border-bottom:1px solid var(--line)}
td{padding:9px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.clic{cursor:pointer;transition:background var(--t)}
tr.clic:hover{background:var(--brandBg)}
.vermelho{color:var(--err);font-weight:600}.verde{color:var(--ok);font-weight:600}.ambar{color:var(--warn);font-weight:600}
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- questões ---------- */
.q-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q-enun{font-size:16px;margin:12px 0 16px;white-space:pre-wrap;line-height:1.68;font-weight:450;letter-spacing:-.005em}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;background:var(--pan);font-size:14.5px;line-height:1.55;touch-action:pan-y;position:relative;transition:border-color var(--t),background var(--t),transform var(--t)}
.alt:hover{border-color:var(--brand);background:var(--pan3)}
.alt .letra{flex:none;width:27px;height:27px;border-radius:8px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fD);font-size:13px;font-weight:700;color:var(--mut);background:var(--pan2);transition:all var(--t)}
.alt:hover .letra{border-color:var(--brand);color:var(--brandInk)}
.alt.sel{border-color:var(--brand);background:var(--brandBg)}
.alt.sel .letra{background:var(--brand);border-color:var(--brand);color:var(--onBrand)}
.alt.certa{border-color:var(--ok);background:var(--okBg)}
.alt.certa .letra{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.errada{border-color:var(--err);background:var(--errBg)}
.alt.errada .letra{background:var(--err);border-color:var(--err);color:#fff}
.alt.riscada .txt{text-decoration:line-through;opacity:.4}
.alt .risco{margin-left:auto;flex:none;color:var(--mut);opacity:.4;padding:3px;border-radius:5px;transition:opacity var(--t),background var(--t)}
.alt .risco:hover{opacity:1;background:var(--pan2)}
.alt .risco svg{width:15px;height:15px}
.coment{border-left:3px solid var(--brand);background:var(--brandBg);border-radius:0 var(--r2) var(--r2) 0;padding:14px 16px;margin-top:14px;font-size:14.2px;line-height:1.65}
.coment .porq{margin-top:10px;padding-top:10px;border-top:1px solid var(--brandLine)}
.coment .porq div{margin-bottom:6px}
.coment .base{margin-top:10px;padding-top:10px;border-top:1px solid var(--brandLine);font-size:12.5px;color:var(--mut)}
.coment .base b{color:var(--ink2)}
.navq{display:flex;gap:9px;margin-top:16px;align-items:center}

/* ---------- simulado ---------- */
.gradeSim{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.gradeSim button{border:1.5px solid var(--line);border-radius:var(--r3);padding:9px 0;min-height:44px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mut);background:var(--pan);transition:all var(--t)}
.gradeSim button:hover{border-color:var(--brand)}
.gradeSim button.resp{background:var(--brandBg);color:var(--brandInk);border-color:var(--brandLine)}
.gradeSim button.atual{outline:2px solid var(--brand);outline-offset:2px}
.gradeSim button.certa{background:var(--okBg);color:var(--ok);border-color:var(--okLine)}
.gradeSim button.errada{background:var(--errBg);color:var(--err);border-color:var(--errLine)}
#cronSim{font-family:var(--fD);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.02em}

/* ---------- painel ---------- */
.cardsMini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.mini{background:var(--pan);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.mini::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--brand)}
.mini:nth-child(2)::before{background:var(--ok)}
.mini:nth-child(3)::before{background:var(--warn)}
.mini:nth-child(4)::before{background:var(--ink2)}
.mini .rot{color:var(--mut);font-size:12.5px;font-weight:600}
.mini .gd{font-variant-numeric:tabular-nums;margin-top:3px}
.barra{height:8px;background:var(--pan2);border-radius:99px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s cubic-bezier(.32,.72,.35,1)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--pan2)}
.heat i.h1{background:#F6DFAF}.heat i.h2{background:#F0BE6A}.heat i.h3{background:#E29215}.heat i.h4{background:#B4700A}
:root[data-tema=escuro] .heat i.h1{background:#4A3A1E}
:root[data-tema=escuro] .heat i.h2{background:#8A6218}
:root[data-tema=escuro] .heat i.h3{background:#D08F26}
:root[data-tema=escuro] .heat i.h4{background:#F2A93B}
@media (prefers-color-scheme:dark){
  :root:not([data-tema=claro]) .heat i.h1{background:#4A3A1E}
  :root:not([data-tema=claro]) .heat i.h2{background:#8A6218}
  :root:not([data-tema=claro]) .heat i.h3{background:#D08F26}
  :root:not([data-tema=claro]) .heat i.h4{background:#F2A93B}
}

/* ---------- cartões ---------- */
.flash{min-height:230px;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:20px}
.flash .frente{font-family:var(--fD);font-size:19px;font-weight:650;max-width:620px;letter-spacing:-.02em;line-height:1.35}
.flash .verso{font-size:15px;color:var(--ink);max-width:660px;white-space:pre-wrap;text-align:left;background:var(--brandBg);border:1px solid var(--brandLine);border-radius:var(--r2);padding:14px 16px;line-height:1.65}

/* ---------- erros ---------- */
#tbErros input,#tbErros textarea{width:100%;border:none;background:transparent;padding:3px 4px;font-size:13.5px;border-radius:5px;box-shadow:none}
#tbErros textarea{resize:vertical;min-height:34px}
#tbErros input:focus,#tbErros textarea:focus{background:var(--brandBg);outline:1px solid var(--brand);box-shadow:none}

/* ---------- leitura ---------- */
.grupoLei{display:flex;align-items:baseline;gap:10px;font-family:var(--fD);font-weight:700;font-size:13px;
  letter-spacing:-.01em;margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.grupoLei small{font-family:var(--fB);font-weight:400;font-size:12px;color:var(--mut);letter-spacing:0}
.leiLin{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:var(--pan);
  border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;
  box-shadow:var(--sh);transition:border-color var(--t),background var(--t)}
.leiLin:hover{border-color:var(--brand);background:var(--pan3)}
.leiMarca{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:var(--pan2);color:var(--mut);border:1px solid var(--line)}
.leiLin.lida .leiMarca{background:var(--ok);border-color:var(--ok);color:#fff}
.leiTxt{display:flex;flex-direction:column;gap:5px;min-width:0}
.leiTopo{display:flex;gap:6px;flex-wrap:wrap}
.leiTxt .tit{font-family:var(--fD);font-weight:700;font-size:15.5px;letter-spacing:-.015em;line-height:1.25}
.leiLin.lida .leiTxt .tit{color:var(--mut)}
@media(max-width:620px){.soAmplo{display:none}.leiBarra .btn{padding:9px 12px;font-size:13px}}
.leiBarra{position:sticky;top:calc(var(--hAlt,96px));z-index:30;margin-bottom:10px;padding:10px 12px}
.leiBarra .leiNome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leiBarra .btn{min-height:44px;padding:9px 13px;font-size:13.5px}
/* altura definida em JS (ajustaQuadro) para o leitor ocupar a tela exata e
   NÃO existirem duas áreas de rolagem concorrentes — só a de dentro da leitura */
#leiQuadro{display:block;width:100%;height:60vh;min-height:320px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--pan);box-shadow:var(--sh)}
body.lendo main{padding-bottom:12px}
@media(max-width:620px){.leiBarra .leiNome{display:none}}
/* ---------- teórico-prática ---------- */
.casoLin{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px;margin-bottom:9px;background:var(--pan);transition:border-color var(--t),background var(--t)}
.casoLin:hover{border-color:var(--brand);background:var(--pan3)}
.casoLin .tit{font-weight:600;font-size:14.5px}
.casoLin .nt{margin-left:auto;flex:none;font-family:var(--fD);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.cenario{white-space:pre-wrap;line-height:1.72;background:var(--pan3);border:1px solid var(--line);border-left:3px solid var(--ink2);border-radius:0 var(--r2) var(--r2) 0;padding:14px 16px;margin:12px 0}
.perg{margin:12px 0 4px;padding-left:22px}
.perg li{margin-bottom:6px}
#prtResp{width:100%;min-height:190px;line-height:1.65;resize:vertical}
.espelho{border-left:3px solid var(--ok);background:var(--okBg);border-radius:0 var(--r2) var(--r2) 0;padding:14px 16px;margin-top:14px}
.pchave{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--okLine);font-size:14px}
.pchave:last-child{border-bottom:none}
.pchave input{margin-top:3px;flex:none}
.pchave .pz{margin-left:auto;flex:none;color:var(--mut);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
#prtNota{font-family:var(--fD);font-variant-numeric:tabular-nums}

/* ---------- nota final ---------- */
.notaG{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;font-size:14px}
.notaG .vl{font-family:var(--fD);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.notaFim{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}

/* alvos de toque: rótulo do checkbox e links de lista sobem para 44px */
label:has(> input[type=checkbox]){display:inline-flex;align-items:center;gap:7px;min-height:44px}
.cartao li > a,.cartao p > a{display:inline-block;padding:6px 0;min-height:32px}
textarea{min-height:80px}
@media(max-width:620px){
  .topo .sub{display:none}
  .contagem{padding:3px 9px;font-size:11px}
  main{padding:14px 12px 72px}
  .cartao{padding:14px}
  .gd{font-size:24px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* ============================================================
   23/09/2026, tt-v15: camada "viva" (portada do ClínicaMed cm-v97/v98, aprovada pelo Matheus).
   Pedido: "muito quadrado, tudo da mesma cor e pouco dinâmico" + "quando eu abra a página, já
   consiga visualizar a questão toda". A identidade Asfalto & Sinalização continua: o âmbar de
   advertência é a marca (Questões e Painel), e cada seção ganha a cor de uma família REAL de
   placas brasileiras: laranja de obras (Simulado), azul de serviços (Prática), marrom de turismo
   (Leitura), preto da educativa (Cartões), vermelho de regulamentação (Erros), verde de indicação
   (Plano), cinza (Ajustes). Onde a placa usa símbolo preto (advertência, obras), o texto sobre a
   cor também é escuro. Tudo aqui SOBRESCREVE o que está acima; nada de dados foi tocado.
   Sem gradiente, sem emoji. Movimento reduzido desliga tudo no fim do bloco.
   ============================================================ */
:root{
  --rG:22px; --rM:16px;
  --mola:cubic-bezier(.34,1.56,.64,1); --suave:cubic-bezier(.22,1,.36,1);
  --shV:0 1px 2px rgba(24,27,33,.04),0 8px 22px -10px rgba(24,27,33,.16);
  --shVM:0 16px 36px -14px rgba(24,27,33,.30),0 2px 6px rgba(24,27,33,.06);
  /* famílias de placa: fill / texto sobre o fill / tinta sobre papel / tinta clara (fundo escuro) */
  --s-adv:#E29215;  --s-adv-on:#20170A; --s-adv-ink:#8A5108; --s-adv-lt:#F2A93B;
  --s-obra:#E8691C; --s-obra-on:#20170A; --s-obra-ink:#A6420A; --s-obra-lt:#FF9A5C;
  --s-reg:#C0261F;  --s-reg-on:#FFFFFF; --s-reg-ink:#B0221B; --s-reg-lt:#F58A82;
  --s-serv:#1D5FA6; --s-serv-on:#FFFFFF; --s-serv-ink:#1D5FA6; --s-serv-lt:#86B7F2;
  --s-ind:#12704A;  --s-ind-on:#FFFFFF; --s-ind-ink:#12704A; --s-ind-lt:#5FD39A;
  --s-tur:#8A5431;  --s-tur-on:#FFFFFF; --s-tur-ink:#7A4A2B; --s-tur-lt:#DDA784;
  --s-edu:#2F3540;  --s-edu-on:#FFFFFF; --s-edu-ink:#2F3540; --s-edu-lt:#C5CAD3;
  --s-cinza:#5E6773; --s-cinza-on:#FFFFFF; --s-cinza-ink:#55606C; --s-cinza-lt:#A9B1BC;
  --ac:var(--s-adv); --acOn:var(--s-adv-on); --acInk:var(--s-adv-ink); --acLt:var(--s-adv-lt);
  --acSup:color-mix(in srgb,var(--ac) 12%,var(--pan));
}
:root[data-tema=escuro]{
  --shV:0 1px 2px rgba(0,0,0,.45),0 10px 24px -14px rgba(0,0,0,.8);
  --shVM:0 18px 40px -16px rgba(0,0,0,.85),0 2px 8px rgba(0,0,0,.4);
  --s-adv:#F2A93B; --s-adv-on:#1A1206; --s-adv-ink:#F2A93B;
  --s-obra-ink:#FF9A5C; --s-reg-ink:#F58A82; --s-serv-ink:#86B7F2; --s-ind-ink:#5FD39A;
  --s-tur-ink:#DDA784; --s-edu:#C5CAD3; --s-edu-on:#14171D; --s-edu-ink:#C5CAD3; --s-cinza-ink:#A9B1BC;
  --acSup:color-mix(in srgb,var(--ac) 20%,var(--pan));
}
@media (prefers-color-scheme:dark){:root:not([data-tema=claro]){
  --shV:0 1px 2px rgba(0,0,0,.45),0 10px 24px -14px rgba(0,0,0,.8);
  --shVM:0 18px 40px -16px rgba(0,0,0,.85),0 2px 8px rgba(0,0,0,.4);
  --s-adv:#F2A93B; --s-adv-on:#1A1206; --s-adv-ink:#F2A93B;
  --s-obra-ink:#FF9A5C; --s-reg-ink:#F58A82; --s-serv-ink:#86B7F2; --s-ind-ink:#5FD39A;
  --s-tur-ink:#DDA784; --s-edu:#C5CAD3; --s-edu-on:#14171D; --s-edu-ink:#C5CAD3; --s-cinza-ink:#A9B1BC;
  --acSup:color-mix(in srgb,var(--ac) 20%,var(--pan));
}}
/* cor da seção (body[data-aba], posto por irAba): a mesma variável pinta botões, barras, foco e aba ativa */
body[data-aba=simulado]{--ac:var(--s-obra);--acOn:var(--s-obra-on);--acInk:var(--s-obra-ink);--acLt:var(--s-obra-lt)}
body[data-aba=pratica]{--ac:var(--s-serv);--acOn:var(--s-serv-on);--acInk:var(--s-serv-ink);--acLt:var(--s-serv-lt)}
body[data-aba=leitura]{--ac:var(--s-tur);--acOn:var(--s-tur-on);--acInk:var(--s-tur-ink);--acLt:var(--s-tur-lt)}
body[data-aba=cartoes]{--ac:var(--s-edu);--acOn:var(--s-edu-on);--acInk:var(--s-edu-ink);--acLt:var(--s-edu-lt)}
body[data-aba=erros]{--ac:var(--s-reg);--acOn:var(--s-reg-on);--acInk:var(--s-reg-ink);--acLt:var(--s-reg-lt)}
body[data-aba=plano]{--ac:var(--s-ind);--acOn:var(--s-ind-on);--acInk:var(--s-ind-ink);--acLt:var(--s-ind-lt)}
body[data-aba=ajustes]{--ac:var(--s-cinza);--acOn:var(--s-cinza-on);--acInk:var(--s-cinza-ink);--acLt:var(--s-cinza-lt)}
body[data-aba]{--acSup:color-mix(in srgb,var(--ac) 12%,var(--pan))}
:root[data-tema=escuro] body[data-aba]{--acSup:color-mix(in srgb,var(--ac) 20%,var(--pan))}
@media (prefers-color-scheme:dark){:root:not([data-tema=claro]) body[data-aba]{--acSup:color-mix(in srgb,var(--ac) 20%,var(--pan))}}
/* cada botão de aba carrega a cor da sua placa (--c) */
[data-aba=questoes],[data-aba=painel]{--c:var(--s-adv);--cOn:#20170A;--cLt:var(--s-adv-lt);--cInk:var(--s-adv-ink)}
[data-aba=simulado]{--c:var(--s-obra);--cOn:var(--s-obra-on);--cLt:var(--s-obra-lt);--cInk:var(--s-obra-ink)}
[data-aba=pratica]{--c:var(--s-serv);--cOn:#fff;--cLt:var(--s-serv-lt);--cInk:var(--s-serv-ink)}
[data-aba=leitura]{--c:var(--s-tur);--cOn:#fff;--cLt:var(--s-tur-lt);--cInk:var(--s-tur-ink)}
[data-aba=cartoes]{--c:#C5CAD3;--cOn:#14171D;--cLt:var(--s-edu-lt);--cInk:var(--s-edu-ink)}
[data-aba=erros]{--c:var(--s-reg);--cOn:#fff;--cLt:var(--s-reg-lt);--cInk:var(--s-reg-ink)}
[data-aba=plano]{--c:var(--s-ind);--cOn:#fff;--cLt:var(--s-ind-lt);--cInk:var(--s-ind-ink)}
[data-aba=ajustes]{--c:var(--s-cinza);--cOn:#fff;--cLt:var(--s-cinza-lt);--cInk:var(--s-cinza-ink)}
body[data-aba]{--c:initial}

/* ---------- cabeçalho: abas em pílula, ícone em círculo da cor da placa ---------- */
nav#abas{max-width:1080px;gap:4px}
nav#abas button{gap:8px;padding:6px 14px 6px 6px;transition:background .2s,color .2s,transform .15s var(--mola)}
nav#abas button svg{width:30px;height:30px;padding:6px;border-radius:50%;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--cLt);transition:transform .25s var(--mola),background .2s,color .2s}
nav#abas button:hover svg{transform:scale(1.1) rotate(-6deg)}
nav#abas button.on,nav#abas button.on:hover{background:var(--c);color:var(--cOn)}
nav#abas button.on svg{background:color-mix(in srgb,var(--cOn) 14%,transparent);color:var(--cOn)}
.marca{border-radius:50%}
@media(min-width:721px) and (max-width:1040px){nav#abas button{padding:6px 10px 6px 5px;gap:6px}nav#abas button svg{width:26px;height:26px;padding:5px}}
@media(max-width:720px){
  #barraAbas button svg{width:48px;height:27px;padding:3px 13px;border-radius:999px;transition:background .2s,color .2s,transform .25s var(--mola)}
  #barraAbas button[data-aba].on,#barraAbas button[data-aba].on:hover{background:transparent;color:var(--cLt)}
  #barraAbas button[data-aba].on svg{background:var(--c);color:var(--cOn);transform:translateY(-1px)}
  #barraAbas button[data-mais].on{background:rgba(255,255,255,.08);color:#F0ECE4}
}
#maisFolha{border-radius:26px 26px 0 0}
#maisFolha .grade button{border-radius:20px;transition:transform .2s var(--mola),background .2s}
#maisFolha .grade button svg{width:40px;height:40px;padding:9px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,var(--pan));color:var(--cInk)}
#maisFolha .grade button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--pan))}
#maisFolha .grade button:active{transform:scale(.96)}

/* ---------- superfícies e controles ---------- */
.cartao{border-radius:var(--rG);box-shadow:var(--shV);border-color:var(--line2);padding:20px 22px}
.cartao h2{font-size:15px;gap:10px}
.cartao.leiBarra{padding:10px 12px}
.cartao h2::before{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.btn{border-radius:999px;padding:10px 20px;background:var(--ac);color:var(--acOn);font-weight:650;
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--ac) 60%,transparent);transition:transform .15s var(--mola),box-shadow .2s,filter .2s,background .2s}
.btn:hover,:root[data-tema=escuro] .btn:hover{background:var(--ac);color:var(--acOn);filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 10px 22px -8px color-mix(in srgb,var(--ac) 70%,transparent)}
.btn:active{transform:scale(.96)}
.btn.fant{background:var(--pan);color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.btn.fant:hover,:root[data-tema=escuro] .btn.fant:hover{background:var(--acSup);border-color:color-mix(in srgb,var(--ac) 45%,var(--line));color:var(--ink);filter:none;box-shadow:none}
.btn.perigo,.btn.perigo:hover{background:var(--err);color:#fff;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--err) 60%,transparent)}
:root[data-tema=escuro] .btn.perigo,:root[data-tema=escuro] .btn.perigo:hover{color:#1A0A09}
@media (prefers-color-scheme:dark){:root:not([data-tema=claro]) .btn.perigo,:root:not([data-tema=claro]) .btn.perigo:hover{color:#1A0A09}}
.btn[disabled]{box-shadow:none}
input,select,textarea{border-radius:14px}
select,input[type=date],input[type=number]{border-radius:999px;padding-left:16px;padding-right:14px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.alt:focus-visible{outline-color:var(--ac)}
input[type=checkbox]{accent-color:var(--ac)}
.chip{padding:4px 11px;font-weight:550}
.barra{height:9px;background:var(--pan2)}
.barra i{background:var(--ac);transition:width 1s var(--suave)}
.rolagem table tr.clic:hover{background:var(--acSup)}
details>summary{border-radius:999px}

/* ---------- questão ---------- */
.q-topo{gap:7px}
.q-topo .chip:first-child{background:var(--acSup);border-color:transparent;color:var(--acInk);font-weight:650}
#qFav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--mola),background .2s}
#qFav:hover{background:var(--pan2);transform:scale(1.08)}
.q-enun{font-size:16.5px;line-height:1.66;margin:8px 0 14px}
.alt{border-radius:18px;padding:7px 12px 7px 9px;margin-bottom:7px;min-height:46px;align-items:center;gap:12px;
  transition:transform .18s var(--mola),border-color .15s,background .15s,box-shadow .2s}
.alt .txt{padding:3px 0}
.alt .letra{width:30px;height:30px;border-radius:50%;border:0;background:var(--pan2);color:var(--ink2);font-size:13.5px;transition:background .2s,color .2s,transform .25s var(--mola)}
button.alt:not(.certa):not(.errada):hover{border-color:var(--ac);background:var(--acSup);transform:translateX(3px);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--ac) 45%,transparent)}
button.alt:not(.certa):not(.errada):hover .letra{background:var(--ac);color:var(--acOn);transform:scale(1.08)}
.alt.sel{border-color:var(--ac);background:var(--acSup)}
.alt.sel .letra{background:var(--ac);color:var(--acOn)}
.alt.certa{border-color:var(--ok);background:var(--okBg)}
.alt.errada{border-color:var(--err);background:var(--errBg)}
.alt.certa .letra{background:var(--ok);color:#fff}
.alt.errada .letra{background:var(--err);color:#fff}
:root[data-tema=escuro] .alt.certa .letra,:root[data-tema=escuro] .alt.errada .letra{color:#101318}
@media (prefers-color-scheme:dark){:root:not([data-tema=claro]) .alt.certa .letra,:root:not([data-tema=claro]) .alt.errada .letra{color:#101318}}
#qAlts .alt.certa{animation:vvAcerto .55s var(--mola)}
#qAlts .alt.errada{animation:vvTreme .45s}
#qAlts .alt.certa .letra{font-size:0}
#qAlts .alt.certa .letra::before{content:"";width:13px;height:7px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:translateY(-2px) rotate(-45deg);animation:vvMarca .45s var(--mola) .1s both}
.alt .risco{border-radius:50%;padding:4px;align-self:center}
.alt:not(:hover) .risco{opacity:.28}
.coment{border-left:0;border-radius:var(--rM);padding:16px 18px;background:var(--acSup);border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);animation:vvDesliza .4s ease both}
.coment:has(> b.verde){background:var(--okBg);border-color:var(--okLine)}
.coment:has(> b.vermelho){background:var(--errBg);border-color:var(--errLine)}
.coment .porq,.coment .base{border-top-color:color-mix(in srgb,currentColor 14%,transparent)}
.navq{margin-top:12px}
.qCombo{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px 4px 8px;font-size:12px;font-weight:700;
  background:color-mix(in srgb,var(--s-obra) 16%,var(--pan));color:var(--s-obra-ink);animation:vvPop .45s var(--mola)}
.qCombo svg{width:15px;height:15px;fill:currentColor;stroke:none}
#qCorpo.entra>.cartao,#sec-simulado .cartao.entra{animation:vvEntraQ .38s var(--suave) both}
#qCorpo.entra.volta>.cartao,#sec-simulado .cartao.entra.volta{animation-name:vvEntraQv}

/* barra de filtros fina e cartão da questão mais largo (cm-v98) */
body[data-aba=questoes] main{max-width:1060px;padding-top:14px}
#sec-questoes>.cartao:first-child{border-radius:999px;padding:6px 8px 6px 8px;margin-bottom:12px;box-shadow:none;background:var(--pan3)}
#sec-questoes>.cartao:first-child .linha{gap:8px;flex-wrap:nowrap}
#sec-questoes>.cartao:first-child select{border-color:transparent;background:var(--pan)}
/* 25/09: seletor de vários temas (mtfiltro.js) ocupa o lugar do antigo select de tema */
#sec-questoes>.cartao:first-child .mtt-btn{flex:1.4 1 0;min-width:0;border-color:transparent;background:var(--pan)}
#sec-questoes>.cartao:first-child .mtt-btn.mtt-ativo{border-color:var(--ac)}
#sec-simulado .mtt-btn{min-width:min(260px,100%)}
#sec-questoes>.cartao:first-child label{white-space:nowrap;padding:0 6px}
#sec-questoes>.cartao:first-child #fqEmbaralha{border-radius:50%;width:44px;padding:0;justify-content:center;flex:none}
#qCorpo>.cartao{padding:18px 28px 18px}
@media(max-width:720px){
  #sec-questoes>.cartao:first-child{border-radius:var(--rG);padding:8px}
  #sec-questoes>.cartao:first-child .linha{flex-wrap:wrap;row-gap:6px}
  #sec-questoes>.cartao:first-child select{flex:1 1 130px}
  #sec-questoes>.cartao:first-child label{margin-right:auto}
  #qCorpo>.cartao{padding:16px 14px}
  .alt{padding:8px 10px 8px 8px}
  button.alt:not(.certa):not(.errada):hover{transform:none}
}

/* ---------- simulado: grade de questões ao lado da questão em tela larga ---------- */
.gradeSim button{border-radius:50%;aspect-ratio:1;padding:0;transition:transform .15s var(--mola),background .2s,border-color .2s}
.gradeSim button:hover{border-color:var(--ac);transform:scale(1.08)}
.gradeSim button.resp{background:var(--acSup);color:var(--acInk);border-color:color-mix(in srgb,var(--ac) 40%,transparent)}
.gradeSim button.atual{outline-color:var(--ac)}

@media(min-width:1000px){

/* ---------- Painel: herói em âmbar de advertência, indicadores coloridos ---------- */
.vHero{position:relative;overflow:hidden;border-radius:28px;padding:28px 32px;margin-bottom:14px;background:var(--s-adv);color:#20170A;
  display:flex;gap:28px;align-items:center;box-shadow:0 18px 40px -18px color-mix(in srgb,var(--s-adv) 80%,transparent)}
:root[data-tema=escuro] .vHero{color:#1A1206}
.vHero .losango{position:absolute;border:3px solid currentColor;border-radius:14px;transform:rotate(45deg);opacity:.10;pointer-events:none}
.vHero .l1{width:220px;height:220px;right:-60px;top:-110px;animation:vvFlutua 9s ease-in-out infinite}
.vHero .l2{width:90px;height:90px;right:230px;bottom:-56px;opacity:.08;animation:vvFlutua 7s ease-in-out infinite reverse}
.vHero .txt{flex:1;min-width:0;position:relative}
.vHero small{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;background:rgba(32,23,10,.10);padding:5px 12px 5px 9px;border-radius:999px}
.vHero small svg{width:16px;height:16px}
.vHero h2{font-family:var(--fD);font-size:29px;line-height:1.12;margin:12px 0 6px;font-weight:800;letter-spacing:-.03em}
.vHero p{margin:0 0 18px;font-size:14.5px;font-weight:500;max-width:52ch}
.vHero .acoesH{display:flex;gap:10px;flex-wrap:wrap}
.vHero .btn{background:#20170A;color:#F2A93B;box-shadow:0 8px 18px -8px rgba(32,23,10,.6)}
.vHero .btn:hover{background:#20170A;color:#F2A93B}
.vHero .btn.fant{background:transparent;color:#20170A;border:1.5px solid rgba(32,23,10,.45);box-shadow:none}
.vHero .btn.fant:hover{background:rgba(32,23,10,.08);color:#20170A;border-color:#20170A}
.vAnel{position:relative;width:132px;height:132px;flex:none}
.vAnel svg{transform:rotate(-90deg);display:block}
.vAnel .trilho{fill:none;stroke:rgba(32,23,10,.14);stroke-width:12}

.vAnel .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.vAnel .val b{font-family:var(--fD);font-size:33px;font-weight:800;letter-spacing:-.03em}
.vAnel .val b.vazio{font-size:15px}
.vAnel .val>span{font-size:11.5px;font-weight:600;margin-top:5px}
.vAtalhos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.vAtalhos button{display:inline-flex;align-items:center;gap:9px;border-radius:999px;padding:6px 16px 6px 6px;min-height:44px;font-weight:600;font-size:13.5px;
  background:color-mix(in srgb,var(--c) 13%,var(--pan));color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);transition:transform .2s var(--mola),box-shadow .2s}
.vAtalhos button:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px color-mix(in srgb,var(--c) 70%,transparent)}
.vAtalhos button svg{width:32px;height:32px;padding:7px;border-radius:50%;background:var(--c);color:var(--cOn)}
.vAtalhos button b{font-family:var(--fD);font-variant-numeric:tabular-nums}
.cardsMini{gap:12px}
.mini{--k:var(--s-serv);--kInk:var(--s-serv-ink);border-radius:22px;border:1px solid color-mix(in srgb,var(--k) 20%,transparent);
  background:color-mix(in srgb,var(--k) 11%,var(--pan));box-shadow:none;padding:16px 18px;transition:transform .2s var(--mola),box-shadow .2s}
:root[data-tema=escuro] .mini{background:color-mix(in srgb,var(--k) 18%,var(--pan))}
@media (prefers-color-scheme:dark){:root:not([data-tema=claro]) .mini{background:color-mix(in srgb,var(--k) 18%,var(--pan))}}
.mini:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px color-mix(in srgb,var(--k) 70%,transparent)}
.mini::before{display:none}
.mini:nth-child(2){--k:var(--s-ind);--kInk:var(--s-ind-ink)}
.mini:nth-child(3){--k:var(--s-obra);--kInk:var(--s-obra-ink)}
.mini:nth-child(4){--k:var(--s-tur);--kInk:var(--s-tur-ink)}
.mini .rot{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink2);font-weight:600}
.mini .gd{color:var(--kInk);font-size:30px;font-weight:800}
.mini .peq.mut{color:var(--ink2)}

/* ---------- Leitura, Prática, Cartões ---------- */
.leiLin{border-radius:20px;padding:15px 16px;border-color:var(--line2);transition:transform .2s var(--mola),box-shadow .2s,border-color .2s}
.leiLin:hover{transform:translateY(-2px);box-shadow:var(--shVM);border-color:color-mix(in srgb,var(--ac) 40%,var(--line));background:var(--pan)}
.leiMarca{border-radius:50%;border:0;background:var(--acSup);color:var(--acInk);width:38px;height:38px}
.leiLin.lida .leiMarca{background:var(--ok);color:#fff}
.grupoLei{border-bottom:0;margin:24px 2px 10px;color:var(--acInk)}
.casoLin{border-radius:18px;transition:transform .2s var(--mola),border-color .2s,background .2s}
.casoLin:hover{border-color:var(--ac);background:var(--acSup);transform:translateX(3px)}
.cenario{border-left:0;border-radius:var(--rM);background:var(--acSup)}
.espelho{border-left:0;border-radius:var(--rM);border:1px solid var(--okLine);animation:vvDesliza .4s ease both}
.flash .frente{font-size:21px}
.flash .verso{border-radius:var(--rM);background:var(--pan3);border-color:var(--line)}
.flash .verso:not([hidden]){animation:vvVira .5s var(--suave) both;transform-origin:top}
#leiQuadro{border-radius:var(--rG)}
.faixa{animation:vvDesliza .3s ease both}

/* ---------- movimento ---------- */
.anima>*{animation:vvSobe .5s var(--suave) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes vvSobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vvPop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes vvMarca{0%{transform:translateY(-2px) rotate(-45deg) scale(.2);opacity:0}100%{transform:translateY(-2px) rotate(-45deg) scale(1);opacity:1}}
@keyframes vvAcerto{0%{transform:scale(1)}35%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes vvTreme{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes vvDesliza{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes vvEntraQ{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes vvEntraQv{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes vvFlutua{0%,100%{translate:0 0}50%{translate:-14px 12px}}
@keyframes vvVira{from{opacity:0;transform:perspective(700px) rotateX(-70deg)}to{opacity:1;transform:none}}
@keyframes vvPulsa{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.confete{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}

  .vAnel{width:112px;height:112px;align-self:center}.vAnel svg{width:112px;height:112px}.vAnel .val b{font-size:27px}
  .vHero .acoesH .btn{flex:1 1 auto;justify-content:center}
  .mini{padding:14px}.mini .gd{font-size:24px}
  .vAtalhos button{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  .anima>*,.vHero .losango,#qAlts .alt,#qAlts .alt .letra::before,.coment,.espelho,.flash .verso,.qCombo,#qCorpo.entra>.cartao,#sec-simulado .cartao.entra,#cronSim::before,.faixa{animation:none!important}
  .barra i,.vAnel .arco{transition:none!important}
  .btn,.alt,.mini,.leiLin,.casoLin,.vAtalhos button{transform:none!important}
}

/* ============================================================
   23/09/2026, tt-v16: camada viva, 2ª rodada (guia MedTech/VIVA-2026-09.md, modelo ClínicaMed cm-v97/v98).
   - Inter servida pelo próprio app; a Archivo (display do Google) saiu. Números em Inter tabular.
   - Superfícies do modelo: papel levemente cinza e fios neutros. No computador, barra lateral CLARA com o
     ícone de cada aba num círculo da cor da sua placa; no celular, cabeçalho claro de uma linha e barra
     inferior clara com o ícone ativo em pílula colorida. A marca (círculo âmbar com o volante) e as cores
     de placa por seção continuam: a identidade Asfalto & Sinalização mora na marca e na faixa do topo.
   - Título de página com selo na cor da seção; avisos em pílula flutuante; nada em caixa alta espaçada.
   Sem gradiente, sem emoji. Movimento reduzido desliga tudo no fim do bloco.
   ============================================================ */
:root{--lado:0px;--bg:#F4F5F8;--pan:#FFFFFF;--pan2:#EDEFF4;--pan3:#F8F9FB;--line:#E1E4EB;--line2:#EAECF1;
  --ink:#161A21;--ink2:#3F4754;--mut:#5E6675}
body{font-size:15px;font-variant-numeric:tabular-nums}
h1,h2,h3,.gd,.num{letter-spacing:-.02em}
/* iPhone instalado (status bar translúcida): uma faixa asfalto atrás do relógio mantém o texto branco legível */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#14171D;z-index:95;pointer-events:none}

/* ---------- cabeçalho claro ---------- */
header{background:var(--pan);color:var(--ink);box-shadow:none;border-bottom:1px solid var(--line)}
.topo .nome{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.topo .nome em{font-style:normal;color:var(--brandInk)}
.topo .sub{color:var(--mut);font-size:12px;letter-spacing:0}
.marca{width:34px;height:34px;box-shadow:0 6px 14px -5px color-mix(in srgb,var(--brand) 70%,transparent)}
.marca svg{width:21px;height:21px}
.contagem{background:var(--brandBg);border-color:var(--brandLine);color:var(--brandInk);font-size:12px;padding:5px 12px}
.contagem b{font-family:var(--fB);font-size:14px}
.btTema{width:42px;height:42px;border-radius:50%;color:var(--ink2);border:1px solid var(--line);background:var(--pan)}
.btTema:hover{background:var(--pan2);color:var(--ink)}
.btTema svg{width:18px;height:18px}
.navGrupo{display:none}
nav#abas button{color:var(--ink2);font-weight:550}
nav#abas button:hover{color:var(--ink);background:var(--pan2)}
nav#abas button svg{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--cInk)}
nav#abas button.on,nav#abas button.on:hover{background:color-mix(in srgb,var(--c) 13%,var(--pan));color:var(--cInk);font-weight:650}
nav#abas button.on svg{background:var(--c);color:var(--cOn);box-shadow:0 6px 14px -5px color-mix(in srgb,var(--c) 65%,transparent)}
[data-aba=cartoes]{--c:var(--s-edu);--cOn:var(--s-edu-on)}
body[data-aba]{--c:initial}

/* ---------- computador: barra lateral clara ---------- */
@media(min-width:900px){
  :root{--lado:252px}
  body{padding-left:var(--lado)}
  header{position:fixed;top:0;left:0;bottom:0;width:var(--lado);border-bottom:0;border-right:1px solid var(--line);
    padding:calc(22px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:11px;
    overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .topo{display:contents}
  .marca{grid-column:1;grid-row:1;margin-left:6px;align-self:center}
  .topo .titulo{grid-column:2;grid-row:1;align-self:center;min-width:0}
  .topo .sub{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav#abas{grid-column:1/-1;grid-row:2;display:flex;flex-direction:column;gap:2px;overflow:visible;padding:24px 0 14px;margin:0;max-width:none;align-self:start}
  nav#abas .navGrupo{display:block;color:var(--mut);font-size:12.5px;font-weight:600;padding:16px 12px 6px}
  nav#abas .navGrupo:first-child{padding-top:0}
  nav#abas button{width:100%;min-height:46px;padding:5px 14px 5px 6px;gap:12px;font-size:14.5px}
  nav#abas button svg{width:34px;height:34px;padding:8px}
  .acoesTopo{grid-column:1/-1;grid-row:3;margin:0;padding:12px 4px 0;border-top:1px solid var(--line);justify-content:space-between}
  main{max-width:1100px;padding:30px 36px 64px}
  body[data-aba=questoes] main{padding-top:22px}
}
/* 900 a 1179 px: barra lateral só com os ícones */
@media(min-width:900px) and (max-width:1179px){
  :root{--lado:84px}
  header{grid-template-columns:1fr;padding-left:10px;padding-right:10px}
  .marca{margin:0 auto}
  .topo .titulo,nav#abas .navGrupo,nav#abas button>span{display:none}
  nav#abas{padding-top:22px;gap:6px}
  nav#abas button{justify-content:center;width:56px;padding:5px;margin:0 auto}
  nav#abas button.on{background:transparent}
  nav#abas button svg{width:40px;height:40px;padding:10px}
  .acoesTopo{flex-direction:column;gap:10px;padding:12px 0 0}
  .contagem{flex-direction:column;align-items:center;gap:0;padding:6px 8px;border-radius:14px;font-size:10.5px;line-height:1.25;text-align:center;white-space:normal}
  main{padding:26px 26px 60px}
}
/* tablet: abas no topo, sem grupos */
@media(min-width:721px) and (max-width:899px){
  nav#abas{padding-bottom:10px}
}

/* ---------- celular: cabeçalho de uma linha e barra inferior clara ---------- */
@media(max-width:720px){
  .topo{padding:10px 14px}
  .marca{width:32px;height:32px}
  #barraAbas{grid-template-columns:repeat(5,minmax(0,1fr));background:var(--pan);border-top:1px solid var(--line);box-shadow:0 -10px 26px -20px rgba(24,27,33,.45)}
  #barraAbas button{color:var(--mut);font-size:11.5px;padding:0 2px;min-width:0}
  #barraAbas button:hover{background:transparent;color:var(--ink)}
  #barraAbas button:active{background:var(--pan2)}
  #barraAbas button svg{background:transparent;color:inherit}
  #barraAbas button[data-aba].on,#barraAbas button[data-aba].on:hover{background:transparent;color:var(--cInk)}
  #barraAbas button[data-aba].on svg{background:var(--c);color:var(--cOn);box-shadow:0 6px 14px -6px color-mix(in srgb,var(--c) 70%,transparent)}
  #barraAbas button[data-mais].on,#barraAbas button[data-mais].on:hover{background:transparent;color:var(--ink)}
  #barraAbas button[data-mais].on svg{background:var(--pan2)}
}
:root[data-tema=escuro] #barraAbas{box-shadow:none}

/* ---------- título de página com selo na cor da seção ---------- */
.pgTitulo{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:center;margin:2px 0 20px}
.pgTitulo .selo{grid-row:span 2;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--acOn);
  box-shadow:0 10px 22px -8px color-mix(in srgb,var(--ac) 65%,transparent);animation:vvPop .5s var(--mola) both}
.pgTitulo .selo svg{width:24px;height:24px}
.pgTitulo h1{font-size:25px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:0;align-self:end}
.pgTitulo p{margin:1px 0 0;font-size:14px;color:var(--mut);align-self:start}
.pgTitulo p:empty{display:none}
.pgTitulo:has(p:empty) h1{align-self:center}
body[data-aba=questoes] .pgTitulo,body.lendo .pgTitulo,
body[data-aba=simulado]:has(#cronSim) .pgTitulo,body[data-aba=simulado]:has(#revVoltar) .pgTitulo{
  position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:0}
@media(max-width:720px){.pgTitulo{margin:4px 0 14px;column-gap:12px}.pgTitulo .selo{width:44px;height:44px}.pgTitulo .selo svg{width:21px;height:21px}.pgTitulo h1{font-size:22px}.pgTitulo p{font-size:13.5px}}

/* ---------- avisos: pílula flutuante (nunca empurra a tela) ---------- */
#faixas{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(50% + var(--lado) / 2);transform:translateX(-50%);
  width:min(560px,calc(100% - var(--lado) - 24px));z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
@media(max-width:720px){#faixas{top:calc(8px + env(safe-area-inset-top))}}
.faixa{pointer-events:auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 14px;
  box-shadow:var(--shVM);font-size:14px;line-height:1.45;font-weight:550}
.faixa.info{background:var(--brandBg);color:var(--ink);border-color:var(--brandLine)}
.faixa.info>svg{color:var(--brandInk)}
.faixa>svg{width:19px;height:19px;flex:none}
.faixa>span{flex:1;min-width:0}
.faixa button{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;padding:0;opacity:.7}
.faixa button:hover{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}
.faixa button svg{width:16px;height:16px}

/* ---------- estado vazio, ícone-botão, campo salvo ---------- */
.vazio{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 18px}
.vazio p{color:var(--ink2);max-width:46ch}
.vazioIco{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--okBg);color:var(--ok)}
.vazioIco svg{width:26px;height:26px}
.flash.vazio .frente{font-size:19px}
.btIco{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--mut);transition:background .2s,color .2s,transform .2s var(--mola)}
.btIco svg{width:18px;height:18px}
.btIco:hover{background:var(--pan2);color:var(--ink)}
.btIco.perigo:hover{background:var(--errBg);color:var(--err)}
.btIco:active{transform:scale(.92)}
.salvo{box-shadow:0 0 0 2px var(--ok)!important;transition:box-shadow .2s}
.semNota{font-size:14px;font-weight:600;color:var(--mut);letter-spacing:0}
.btn svg{width:17px;height:17px}
.btn.peq{font-size:13.5px;padding:8px 16px}
@media(max-width:620px){.navq .btn.ant{width:44px;padding:0;justify-content:center;flex:none}}

/* ---------- Questões ---------- */
.qNum{font-variant-numeric:tabular-nums}
.qMeta{margin-left:auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.leiRodape{display:flex;justify-content:center;margin:18px 0 6px}
#qFav{width:44px;height:44px}
.alt .letra{font-family:var(--fB);font-weight:700}

/* ---------- Painel: indicadores com ícone em círculo e barra com o corte de 60% ---------- */
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:start}
.mini>*{grid-column:1}
.mini .ico{grid-column:2;grid-row:1 / span 3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--k);color:#fff;
  box-shadow:0 6px 14px -6px color-mix(in srgb,var(--k) 70%,transparent)}
.mini .ico svg{width:20px;height:20px}

<script>
"use strict";
/* ================== TráfegoTítulo v1 ================== */
const V="1.0.0";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dataISO=(d=new Date())=>{const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const addDiasISO=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return dataISO(d)};
const novoIdLinha=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LETRAS="ABCDE";

/* ---------- 2.1 chave estável por conteúdo (djb2+FNV, Math.imul) ---------- */
function hashTxt(s){
  let h1=5381, h2=0x811c9dc5;
  for(let i=0;i<s.length;i++){
    const c=s.charCodeAt(i);
    h1=((h1<<5)+h1+c)>>>0;
    h2=Math.imul(h2^c, 0x01000193)>>>0;
  }
  return (h1.toString(36)+h2.toString(36)).slice(0,10);
}
function chaveTxt(t){
  t=String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return hashTxt(t);
}
function chaveQ(q){ return chaveTxt(q.q); }

const BANCO=window.BANCO||[], TAXONOMIA=window.TAXONOMIA||[], FLASH=window.FLASH||[], PRATICA=window.PRATICA||[];
const QIDX=new Map(); BANCO.forEach(q=>{const ch=chaveQ(q); if(QIDX.has(ch))console.warn("COLISÃO de chave:",ch,q.q.slice(0,60)); QIDX.set(ch,q); q._ch=ch;});
const TNOME=Object.fromEntries(TAXONOMIA.map(t=>[t.id,t.nome]));

/* ---------- UI: faixas de aviso ---------- */
const ICO_X='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const ICO_FAIXA={ok:'<path d="M20 6 9 17l-5-5"/>',erro:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'};
const UI={
  banner(tipo,msg,fixa){
    const d=document.createElement("div");d.className="faixa "+tipo;
    d.setAttribute("role",tipo==="erro"?"alert":"status");
    d.innerHTML=`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICO_FAIXA[tipo]||ICO_FAIXA.info}</svg><span>${esc(msg)}</span><button type="button" aria-label="Fechar aviso">${ICO_X}</button>`;
    d.querySelector("button").onclick=()=>d.remove();
    $("#faixas").appendChild(d);
    if(!fixa)setTimeout(()=>d.remove(),tipo==="ok"?6000:12000);
  }
};

/* ---------- 2.2 blindagem de armazenamento ---------- */
// PREF e a UNICA fonte do prefixo: TTKEYS deriva dele e listaBackups/restaura filtram por ele.
// (Este ARM veio do RadioTitulo com "rt_" fixo no codigo: a lista de backups dizia 0 chaves e
//  restaurar nao devolvia nada, em silencio. Nao voltar a escrever o prefixo literal.)
const PREF="tt_";
const TTKEYS=["resp","riscos","fav","flash","erros","plano","meta","cfg","sim","simativo","pos","treino","atividade","lidas","syncmeta"].map(s=>PREF+s);
const ARM={
  db:null, travas:{}, persistOK:null, tsBackup:0, recuperado:null,
  async boot(){
    // timeout de segurança: IDB preso (aba antiga/modo privado) não pode travar o boot
    this.db=await Promise.race([new Promise(res=>setTimeout(()=>res(null),2500)),new Promise(res=>{
      try{
        const rq=indexedDB.open("tt-db",1);
        rq.onupgradeneeded=()=>{const d=rq.result;
          if(!d.objectStoreNames.contains("espelho"))d.createObjectStore("espelho");
          if(!d.objectStoreNames.contains("backups"))d.createObjectStore("backups",{autoIncrement:true});
        };
        rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
      }catch(e){res(null)}
    })]);
    // recuperação: canário sumiu do localStorage mas o espelho IDB tem dados?
    let canario=null; try{canario=localStorage.getItem("tt_canary")}catch(e){}
    if(!canario&&this.db){
      const esp=await this.idbTudo("espelho");
      const chaves=Object.keys(esp).filter(k=>TTKEYS.includes(k));
      if(chaves.length){
        chaves.forEach(k=>{try{localStorage.setItem(k,esp[k])}catch(e){}});
        this.recuperado={n:chaves.length,quando:esp.__quando||"data desconhecida"};
      }
    }
    try{localStorage.setItem("tt_canary",new Date().toISOString())}catch(e){}
    this.idbPut("__quando",new Date().toISOString());
    if(navigator.storage&&navigator.storage.persist){
      try{this.persistOK=await navigator.storage.persist()}catch(e){this.persistOK=false}
    }
  },
  idbPut(k,v){ if(!this.db)return;
    try{this.db.transaction("espelho","readwrite").objectStore("espelho").put(v,k)}catch(e){} },
  idbTudo(loja){ return new Promise(res=>{ if(!this.db)return res({});
    try{const out={},cur=this.db.transaction(loja,"readonly").objectStore(loja).openCursor();
      cur.onsuccess=()=>{const c=cur.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};
      cur.onerror=()=>res({});
    }catch(e){res({})} }) },
  load(k,fb){
    let raw=null, falhou=false;
    try{raw=localStorage.getItem(k)}catch(e){falhou=true;this.travas[k]="leitura falhou: "+e.message}
    if(raw===null&&!falhou)return fb;          // nunca gravada: fallback é seguro
    if(!falhou){ try{return JSON.parse(raw)}catch(e){this.travas[k]="JSON corrompido"} }
    UI.banner("erro",`Falha ao ler ${k} neste aparelho. Para não apagar nada, essa parte não será gravada até reabrir o app; o que já está na sua conta continua salvo.`,true);
    return fb;
  },
  save(k,v){
    if(this.travas[k]){UI.banner("erro",`Não gravei ${k}: a leitura falhou neste boot (proteção contra sobrescrita).`);return false}
    let s; try{s=JSON.stringify(v)}catch(e){return false}
    try{localStorage.setItem(k,s)}catch(e){UI.banner("erro","Armazenamento cheio/indisponível: "+e.message,true);return false}
    this.idbPut(k,s);
    try{window.TTSYNC&&TTSYNC.aoSalvar(k)}catch(e){}
    const ag=Date.now();
    if(ag-this.tsBackup>10*60*1000){this.tsBackup=ag;this.snapshot("auto")}
    return true;
  },
  snapshot(motivo){ return new Promise(res=>{ if(!this.db)return res(false);
    const foto={__quando:new Date().toISOString(),__motivo:motivo||"manual"};
    TTKEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)foto[k]=v}catch(e){}});
    try{
      const tx=this.db.transaction("backups","readwrite"),st=tx.objectStore("backups");
      st.add(foto);
      const rq=st.getAllKeys();
      rq.onsuccess=()=>{const ks=rq.result;
        if(ks.length>12){const tx2=this.db.transaction("backups","readwrite");
          ks.slice(0,ks.length-12).forEach(k=>tx2.objectStore("backups").delete(k))}
        res(true)};
      rq.onerror=()=>res(false);
    }catch(e){res(false)} }) },
  listaBackups(){ return new Promise(res=>{ if(!this.db)return res([]);
    try{const out=[],cur=this.db.transaction("backups","readonly").objectStore("backups").openCursor();
      cur.onsuccess=()=>{const c=cur.result;
        if(c){out.push({id:c.key,quando:c.value.__quando,motivo:c.value.__motivo,
          n:Object.keys(c.value).filter(k=>k.startsWith(PREF)).length});c.continue()}
        else res(out.reverse())};
      cur.onerror=()=>res([]);
    }catch(e){res([])} }) },
  restaura(id){ return new Promise(res=>{ if(!this.db)return res(false);
    try{const rq=this.db.transaction("backups","readonly").objectStore("backups").get(id);
      rq.onsuccess=async()=>{const foto=rq.result;if(!foto)return res(false);
        await this.snapshot("antes-de-restaurar");
        Object.keys(foto).filter(k=>k.startsWith(PREF)).forEach(k=>{try{localStorage.setItem(k,foto[k])}catch(e){}});
        res(true)};
      rq.onerror=()=>res(false);
    }catch(e){res(false)} }) },
  exporta(){ const out={__app:"trafego-titulo",__v:V,__quando:new Date().toISOString()};
    TTKEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)out[k]=v}catch(e){}});
    return out },
  async importa(obj){ if(!obj||obj.__app!=="trafego-titulo")return null;
    await this.snapshot("antes-de-importar");
    let n=0;
    TTKEYS.forEach(k=>{ if(typeof obj[k]==="string"){
      try{JSON.parse(obj[k])}catch(e){return}
      try{localStorage.setItem(k,obj[k]);this.idbPut(k,obj[k]);n++}catch(e){} }});
    return n }
};

/* ---------- estado ---------- */
let ST={};
function carregaEstado(){
  ST={
    resp:ARM.load("tt_resp",{}), riscos:ARM.load("tt_riscos",{}), fav:ARM.load("tt_fav",{}),
    flash:ARM.load("tt_flash",{}), erros:ARM.load("tt_erros",[]), plano:ARM.load("tt_plano",[]),
    meta:ARM.load("tt_meta",{}), cfg:ARM.load("tt_cfg",{}), sim:ARM.load("tt_sim",[]),
    simativo:ARM.load("tt_simativo",null), pos:ARM.load("tt_pos",{}), treino:ARM.load("tt_treino",{}),
    atividade:ARM.load("tt_atividade",{}), lidas:ARM.load("tt_lidas",{})
  };
}
function atividade(n){const d=dataISO();ST.atividade[d]=(ST.atividade[d]||0)+n;ARM.save("tt_atividade",ST.atividade)}
function registraResposta(q,alt,ok,modo){
  const ch=q._ch, r=ST.resp[ch]||(ST.resp[ch]={hist:[]});
  r.hist.push({d:dataISO(),ok,alt,m:modo,ts:Date.now()});
  if(r.hist.length>60)r.hist=r.hist.slice(-60);
  ARM.save("tt_resp",ST.resp); atividade(1);
}
const respostaDe=q=>ST.resp[q._ch];
const taxaAcerto=hist=>hist.length?hist.filter(h=>h.ok).length/hist.length:null;

/* ---------- abas ---------- */
const ABAS=[
  ["questoes","Questões",'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'],
  ["simulado","Simulado",'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>'],
  ["pratica","Prática",'<path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v6h6M8 14h6M8 17.5h4"/>'],
  ["leitura","Leitura",'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h5"/>'],
  ["painel","Painel",'<path d="M3 3v18h18M7 14v4M12 10v8M17 6v12"/>'],
  ["cartoes","Cartões",'<rect x="2" y="6" width="16" height="12" rx="2"/><path d="M22 4v12M6 10h8M6 14h5"/>'],
  ["erros","Erros",'<path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'],
  ["plano","Plano",'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'],
  ["ajustes","Ajustes",'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>']
];
let abaAtual="";
/* celular: 4 destinos fixos na barra inferior; o resto vai para a folha "Mais" */
const ABAS_BARRA=["questoes","simulado","pratica","leitura"];
const ICO_MAIS='<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>';
/* barra lateral (computador): dois grupos, na ordem de uso */
const GRUPOS_ABAS=[["Estudar",["questoes","simulado","pratica","leitura","cartoes"]],["Acompanhar",["painel","erros","plano","ajustes"]]];
function montaAbas(){
  const bt=([id,nome,ic])=>`<button type="button" data-aba="${id}" title="${nome}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ic}</svg><span>${nome}</span></button>`;
  const porId=Object.fromEntries(ABAS.map(a=>[a[0],a]));
  $("#abas").innerHTML=GRUPOS_ABAS.map(([g,ids])=>`<div class="navGrupo">${g}</div>`+ids.map(id=>bt(porId[id])).join("")).join("");
  $("#abas").querySelectorAll("button").forEach(b=>b.onclick=()=>irAba(b.dataset.aba));
  $("#barraAbas").innerHTML=ABAS.filter(a=>ABAS_BARRA.includes(a[0])).map(bt).join("")+
    `<button type="button" data-mais="1" aria-haspopup="dialog"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICO_MAIS}</svg><span>Mais</span></button>`;
  $("#barraAbas").querySelectorAll("button[data-aba]").forEach(b=>b.onclick=()=>{fechaMais();irAba(b.dataset.aba);window.scrollTo(0,0)});
  $("#barraAbas").querySelector("[data-mais]").onclick=abreMais;
  $("#maisFundo").onclick=fechaMais;
  addEventListener("keydown",e=>{if(e.key==="Escape")fechaMais()});
}
function abreMais(){
  const f=$("#maisFolha");
  f.innerHTML=`<div class="alca"></div><h2>Mais seções</h2><div class="grade">${
    ABAS.filter(a=>!ABAS_BARRA.includes(a[0])).map(([id,nome,ic])=>
      `<button type="button" data-aba="${id}" class="${id===abaAtual?"on":""}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${nome}</button>`).join("")}</div>`;
  f.querySelectorAll("button[data-aba]").forEach(b=>b.onclick=()=>{fechaMais();irAba(b.dataset.aba);window.scrollTo(0,0)});
  $("#maisFundo").hidden=false;f.hidden=false;
  const pri=f.querySelector("button");pri&&pri.focus();
}
function fechaMais(){ $("#maisFundo").hidden=true;$("#maisFolha").hidden=true; }
function medeCabecalho(){
  const h=document.querySelector("header");
  /* no computador o cabeçalho vira barra lateral: nada fica preso no topo */
  const lateral=h&&getComputedStyle(h).position==="fixed";
  if(h)document.documentElement.style.setProperty("--hAlt",(lateral?0:h.offsetHeight)+"px");
}
addEventListener("resize",medeCabecalho);
function irAba(id,semHash){
  abaAtual=id;
  document.body.dataset.aba=id;   /* camada viva: a cor da seção sai daqui (CSS body[data-aba]) */
  if(id!=="leitura"){LEI.aberta=null;document.body.classList.remove("lendo")}
  document.querySelectorAll("nav button").forEach(b=>{const on=b.dataset.aba===id;b.classList.toggle("on",on);
    if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  pintaTitulo();
  const mais=document.querySelector("#barraAbas [data-mais]");
  if(mais)mais.classList.toggle("on",!ABAS_BARRA.includes(id));
  document.querySelectorAll("main section").forEach(s=>s.classList.toggle("on",s.id==="sec-"+id));
  if(!semHash&&location.hash!=="#"+id)history.replaceState(null,"","#"+id);
  ST.pos.aba=id;ARM.save("tt_pos",ST.pos);
  const r=({questoes:montaQuestoes,simulado:montaSimulado,pratica:montaPratica,leitura:montaLeitura,painel:montaPainel,
    cartoes:montaCartoes,erros:montaErros,plano:montaPlano,ajustes:montaAjustes}[id]||(()=>{}))();
  const sec=$("#sec-"+id);
  if(r&&r.then)r.then(()=>vivo(sec));else vivo(sec);
}
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(ABAS.some(a=>a[0]===h))irAba(h,true)});

function montaLeitura(){
  if(LEI.aberta)return desenhaLeitura();
  pintaTitulo();
  const sec=$("#sec-leitura");
  const lidas=Object.keys(ST.lidas).length;
  const min=LEITURAS.filter(i=>i.f).reduce((a,i)=>a+(i.min||0),0);
  let html=`
  <div class="cartao leiBusca">
    <label class="busca"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

  </div>
  <p class="peq mut leiNota">Resumos escritos a partir da fonte primária (CTB, resoluções do CONTRAN, diretrizes da ABRAMET), com tabelas de corte, armadilhas, autoteste e fontes. Cerca de ${min} min no total.</p>`;
  LEITURAS.forEach(it=>{
    if(it.grupo){
      html+=`<h2 class="grupoLei">${esc(it.grupo)}${it.sub?`<small>${esc(it.sub)}</small>`:""}</h2>`;
      return;
    }
    const lida=!!ST.lidas[it.f];
    const tema=TAXONOMIA.find(t=>t.id===it.area);
    const busca=normBusca([it.t,it.s,it.tipo,tema?tema.nome:""].join(" "));
    html+=`
    <button type="button" class="leiLin${lida?" lida":""}" data-f="${esc(it.f)}" data-busca="${esc(busca)}">
      <span class="leiMarca" aria-hidden="true">${lida?ICO_CHECK:ICO_LIVRO}</span>
      <span class="leiTxt">
        <span class="tit">${esc(it.t)}</span>
        <span class="peq mut">${esc(it.s)}</span>
        <span class="leiMeta">${esc(it.tipo)} · ${it.min} min${tema?" · "+esc(tema.nome):""}${lida?' · <b>lida</b>':""}</span>
      </span>
    </button>`;
  });
  if(lidas)html+=`<div class="leiRodape"><button class="btn fant peq" id="leiZerar" type="button">Zerar marcações de leitura</button></div>`;
  html+=`<div class="cartao vazio" id="leiVazio" hidden><p>Nenhuma leitura encontrada para essa busca.</p><button class="btn fant" type="button" id="leiLimpa">Limpar busca</button></div>`;
  sec.innerHTML=html;
  sec.querySelectorAll(".leiLin").forEach(b=>b.onclick=()=>{LEI.aberta=b.dataset.f;desenhaLeitura()});
  const z=$("#leiZerar");
  if(z)z.onclick=()=>{if(!confirm("Desmarcar todas as leituras marcadas como lidas?"))return;ST.lidas={};ARM.save("tt_lidas",ST.lidas);montaLeitura();UI.banner("ok","Marcações de leitura zeradas.")};
  const bx=$("#leiBusca");
  bx.oninput=()=>{LEI.busca=bx.value;filtraLeituras()};
  bx.onkeydown=e=>{if(e.key==="Escape"&&bx.value){e.stopPropagation();bx.value="";LEI.busca="";filtraLeituras()}};
  $("#leiLimpa").onclick=()=>{bx.value="";LEI.busca="";filtraLeituras();bx.focus()};
  filtraLeituras();
}
/* busca sem acento e sem caixa; esconde o grupo que ficar vazio */
const normBusca=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function filtraLeituras(){
  const sec=$("#sec-leitura"),termos=normBusca(LEI.busca).split(/\s+/).filter(Boolean);
  let vis=0,grupo=null,noGrupo=0;
  const fecha=()=>{if(grupo)grupo.hidden=!noGrupo};
  [...sec.children].forEach(el=>{
    if(el.classList.contains("grupoLei")){fecha();grupo=el;noGrupo=0;return}
    if(!el.classList.contains("leiLin"))return;
    const ok=termos.every(t=>el.dataset.busca.includes(t));
    el.hidden=!ok;if(ok){vis++;noGrupo++}
  });
  fecha();
  const v=$("#leiVazio");if(v)v.hidden=vis>0;
}

/* o app avisa a leitura aberta quando o tema muda */
/* o leitor ocupa a altura exata que sobra: a página do app não rola, só a leitura */
function ajustaQuadro(){
  const q=$("#leiQuadro"); if(!q)return;
  /* janela ainda sem altura (painel oculto, layout não assentado): tenta de novo
     no próximo quadro em vez de travar o leitor na altura mínima */
  if(!window.innerHeight){requestAnimationFrame(ajustaQuadro);return}
  const topo=q.getBoundingClientRect().top+window.scrollY;
  const barra=document.getElementById("barraAbas");
  const bh=barra&&getComputedStyle(barra).display!=="none"?barra.offsetHeight:0;
  const h=Math.max(320, window.innerHeight - topo - bh - 14);
  q.style.height=h+"px";
}
